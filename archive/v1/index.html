<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smuggler — dice sentence prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
  :root { /* colour defaults; CONFIG.colors overrides them at start-up */
    --bg:#0b0b10; --panel:#16161f; --line:#2a2a3a; --text:#e8e6f0; --dim:#8a88a0;
    --lit:#ffe36b; --status:#ffd36b; --danger:#ff3b3b; --glow:#ffffff; --pip:#e8e6f0; --broken:#5a5a66; --turned:#4fe06a; --tiletext:#0b0b10;
    --lift:1.07;
    --display:"Bungee", Impact, "Arial Black", "Helvetica Neue", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"Courier New", ui-monospace, Menlo, Consolas, monospace; font-weight:700;
    user-select:none; -webkit-user-select:none; }
  body { display:flex; align-items:flex-start; }
  #stage { margin:0 auto; position:relative; width:1280px; height:720px; flex:none; overflow:hidden; background:var(--bg); }
  button { font:inherit; color:inherit; cursor:pointer; }

  /* top bar */
  #top { position:absolute; left:0; top:0; width:100%; height:40px; display:flex; align-items:center; gap:28px;
    padding:0 24px; border-bottom:2px solid var(--line); letter-spacing:.15em; font-size:16px; }
  #top .title { color:var(--dim); }
  #top .spacer { flex:1; }
  #stageInd { display:flex; gap:8px; align-items:center; font-size:14px; }
  #stageInd span { color:var(--dim); opacity:.55; }
  #stageInd span.cur { color:var(--lit); opacity:1; border-bottom:3px solid var(--lit); }
  #stageInd span.done { text-decoration:line-through; opacity:.35; }
  #stageInd i { font-style:normal; color:var(--line); }
  #invCount { font-size:14px; color:var(--dim); }
  #scars { display:flex; align-items:center; gap:8px; }
  .scarbox { width:16px; height:16px; border:2px solid var(--danger); display:inline-block; }
  .scarbox.on { background:var(--danger); }

  /* tiles */
  .tile { display:inline-block; padding:10px 14px; font-size:24px; line-height:1; letter-spacing:.04em;
    color:var(--tiletext); background:#888; border:3px solid #000; box-shadow:0 4px 0 rgba(0,0,0,.55); text-transform:uppercase; }
  .tile.small { font-size:16px; padding:6px 9px; border-width:2px; }
  .tile.scar { background-image:repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--danger) 28%, transparent) 7px 9px); }
  .tile.broken { text-decoration:line-through; }
  .faceRow { display:flex; justify-content:center; align-items:center; }
  .faceRow .tile + .tile { margin-left:-3px; }

  /* enemy */
  #enemy { position:absolute; left:0; top:40px; width:100%; height:232px; padding:16px 24px; display:flex; gap:40px; }
  #intentPanel { width:520px; display:flex; flex-direction:column; gap:4px; position:relative; }
  #enemyMeta { min-height:16px; font-size:13px; letter-spacing:.08em; color:var(--dim); display:flex; gap:10px; align-items:center; }
  #enemyMeta .chip { border:2px solid var(--line); padding:0 6px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  #bag { position:absolute; right:0; top:-2px; display:flex; align-items:center; gap:6px; }
  #bag.hidden { display:none; }
  #bag .tile { font-size:12px; padding:4px 6px; border-width:2px; }
  .vb { cursor:help; }
  .lbl { font-size:13px; letter-spacing:.2em; color:var(--dim); }
  #intentRow { display:flex; align-items:flex-end; gap:20px; height:84px; }
  #intentTile { font-size:40px; padding:16px 22px; }
  #intentText { min-height:22px; font-size:18px; }
  #nextWrap { display:flex; align-items:center; gap:10px; min-height:40px; }
  #nextWrap .q { opacity:.5; display:flex; align-items:center; gap:8px; }
  #nextWrap.hidden { visibility:hidden; }
  #enemyText { min-height:22px; font-size:18px; color:var(--status); }
  #faceStrip { flex:1; display:flex; gap:10px; align-items:flex-start; padding-top:22px; }
  .efc { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 4px 8px;
    border:3px solid transparent; position:relative; }
  .efc .tile { font-size:16px; padding:10px 6px; width:100%; text-align:center; }
  .efc.is-current { border-color:var(--glow); }
  .efc.is-next { border:3px dashed var(--dim); }
  .efc.is-then { border:3px dotted var(--line); }
  .efc .tag { position:absolute; top:-18px; left:0; width:100%; text-align:center; font-size:11px; letter-spacing:.15em; color:var(--dim); }
  .efc.is-current .tag { color:var(--glow); }
  .pips { display:flex; gap:8px; }
  .pip { width:18px; height:18px; border:3px solid #000; background:var(--pip); }
  .pip.broken { background:var(--broken); transform:rotate(45deg) scale(.7); }
  .pip.turned { background:var(--turned); border-radius:50%; }

  /* sentence */
  #sentence { position:absolute; left:0; top:272px; width:100%; height:190px; display:flex; flex-direction:column; align-items:center; }
  #slots { display:flex; align-items:center; gap:14px; }
  .slot { width:262px; height:104px; border:3px dashed var(--line); background:rgba(255,255,255,.025);
    display:flex; align-items:center; justify-content:center; position:relative; }
  .slot .num { position:absolute; left:6px; top:3px; font-size:12px; color:var(--dim); }
  .slot.over { border-color:var(--glow); background:rgba(255,255,255,.1); }
  .slot.full { border-style:solid; }
  .slot.acting { border-color:var(--glow); background:rgba(255,255,255,.14); }
  #slots.complete .slot { border-color:var(--lit); }
  .arrow { font-size:26px; color:var(--dim); width:30px; text-align:center; }
  #preview { margin-top:14px; text-align:center; min-height:62px; }
  #shape { font-size:14px; letter-spacing:.25em; color:var(--dim); text-transform:uppercase; min-height:18px; }
  #previewText { font-size:22px; margin:6px auto 0; max-width:1200px; line-height:1.25; }
  #previewText.hint { color:var(--dim); font-size:18px; }

  /* bottom */
  #bottom { position:absolute; left:0; top:468px; width:100%; height:200px; }
  #tray { display:flex; justify-content:center; gap:30px; }
  .cell { width:262px; height:128px; border:3px solid var(--line); background:var(--panel);
    display:flex; align-items:center; justify-content:center; }
  .cell.over { border-color:var(--glow); }
  .die { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; position:relative; touch-action:none; cursor:grab; }
  .die .cap { font-size:11px; letter-spacing:.2em; color:var(--dim); }
  .die .held { position:absolute; right:4px; top:2px; font-size:12px; letter-spacing:.1em; color:var(--tiletext);
    background:var(--lit); padding:2px 5px; display:none; }
  .die.held .held { display:block; }
  .die.held .faceRow { transform:translateY(5px); }
  .die.dim .faceRow { opacity:.35; }
  .die .frz { position:absolute; left:4px; top:2px; font-size:12px; letter-spacing:.1em; color:#06222c; background:#8fe0ff;
    padding:2px 5px; display:none; }
  .die.frozen { outline:3px solid #8fe0ff; outline-offset:-3px; background:color-mix(in srgb, #8fe0ff 12%, transparent);
    box-shadow:inset 0 0 22px #8fe0ff88; cursor:not-allowed; }
  .die.frozen .frz { display:block; }
  .nf .sturdy { position:absolute; right:-2px; top:-9px; font-size:10px; letter-spacing:.08em; font-weight:400; color:var(--dim);
    background:var(--panel); border:1px solid var(--line); padding:0 4px; }
  .die .ctl button { background:var(--panel); border:2px solid var(--line); padding:0 10px; font-size:13px; line-height:18px; }
  .die .ctl button:hover { border-color:var(--glow); }
  .die.in-slot .up, .die:not(.in-slot) .down { display:none; }
  .die.dragging { position:fixed; z-index:60; cursor:grabbing; background:var(--panel); border:3px solid var(--glow);
    box-shadow:0 12px 0 rgba(0,0,0,.5); pointer-events:none; }
  .die.dragging .ctl { display:none; }
  #buttons { margin-top:22px; display:flex; justify-content:center; align-items:center; gap:18px; }
  .btn { background:var(--panel); border:3px solid var(--glow); padding:12px 26px; font-size:20px; letter-spacing:.12em;
    box-shadow:0 4px 0 rgba(0,0,0,.6); }
  .btn:disabled { opacity:.3; cursor:default; border-color:var(--line); }
  .btn:not(:disabled):hover { background:var(--glow); color:var(--tiletext); }
  .btn.primary { background:var(--lit); color:var(--tiletext); border-color:#000; }
  #status { color:var(--status); font-size:15px; min-width:210px; }
  #help { position:absolute; left:0; bottom:8px; width:100%; text-align:center; font-size:13px; color:var(--dim); padding:0 40px; }

  /* popover */
  #pop { position:absolute; z-index:40; display:none; background:#000; border:3px solid var(--glow); padding:8px 10px;
    pointer-events:none; }
  #pop .row { display:flex; gap:8px; align-items:center; }
  #pop .f { padding:4px; border:3px solid transparent; }
  #pop .f.cur { border-color:var(--glow); }
  #pop .tile { font-size:12px; padding:5px 6px; border-width:2px; box-shadow:none; }
  #pop .ttl { font-size:11px; letter-spacing:.2em; color:var(--dim); margin-bottom:6px; }

  /* overlay */
  #overlay { position:absolute; inset:0; z-index:80; background:rgba(5,5,8,.82); display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  #overlay.show { display:flex; }
  #overlay .big { font-size:84px; letter-spacing:.1em; }
  #overlay .sub { font-size:20px; color:var(--dim); max-width:760px; text-align:center; }
  /* ===== Phase 3: juice ===== */
  .tile, .btn, #top .title, #overlay .big, .flyer, #pop .tile { font-family:var(--display); font-weight:400; white-space:nowrap; }
  .tile { letter-spacing:.02em; }
  .efc .tile { letter-spacing:0; }
  .die { transition: scale .1s ease-out; }
  .die .faceRow { transition: transform .12s ease-out; }
  .die.dragging { scale:var(--lift); box-shadow:0 18px 0 rgba(0,0,0,.45); }
  .die.held { background:color-mix(in srgb, var(--lit) 6%, transparent); }
  .flyer { position:absolute; left:0; top:0; z-index:70; pointer-events:none; font-size:34px; line-height:1;
    -webkit-text-stroke:2px #000; paint-order:stroke fill; text-shadow:0 4px 0 rgba(0,0,0,.6); will-change:transform; }
  .flyer.small { font-size:20px; }
  .spark { position:absolute; left:0; top:0; z-index:70; width:9px; height:9px; pointer-events:none; border:2px solid #000; }
  .crack { position:absolute; inset:0; pointer-events:none; z-index:5; }
  .crack svg { width:100%; height:100%; }
  .die { z-index:1; }
  /* sentence complete: tiles + arrows light up together */
  @keyframes litFlash { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--lit) 95%, transparent); } 100% { box-shadow:0 0 26px 8px color-mix(in srgb, var(--lit) 0%, transparent); } }
  @keyframes arrowLit { 0% { transform:scale(1.9); } 100% { transform:scale(1); } }
  @keyframes ovPop { 0% { transform:scale(.4) rotate(-6deg); opacity:0; } 60% { transform:scale(1.12) rotate(2deg); opacity:1; } 100% { transform:scale(1) rotate(0); } }
  #slots.complete .slot { animation:litFlash .45s ease-out; background:color-mix(in srgb, var(--lit) 7%, transparent); box-shadow:0 0 14px 2px color-mix(in srgb, var(--lit) 45%, transparent); }
  #slots.complete .arrow { color:var(--lit); animation:arrowLit .4s ease-out; text-shadow:0 0 10px color-mix(in srgb, var(--lit) 90%, transparent); }
  #slots.complete .die .tile { filter:brightness(1.1) saturate(1.1); }
  #overlay.show .big { animation:ovPop .5s cubic-bezier(.2,1.4,.4,1); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
  }

  .pip.unknown { background:transparent; border:3px dashed var(--dim); }

  /* ===== V1-2: trip screens ===== */
  #screen { position:absolute; left:0; right:0; top:40px; bottom:0; z-index:55; background:var(--bg); display:none;
    flex-direction:column; align-items:center; padding:22px 40px; gap:16px; }
  #screen.show { display:flex; }
  #screen h2 { margin:0; font-family:var(--display); font-weight:400; font-size:52px; flex:none; letter-spacing:.06em; }
  #screen .sub { color:var(--dim); font-size:17px; text-align:center; max-width:820px; }
  #screen .sect { font-size:13px; letter-spacing:.25em; color:var(--dim); margin-top:4px; }
  #screen > * { flex-shrink:0; }
  #screen .row { display:flex; gap:22px; justify-content:center; align-items:stretch; flex-wrap:wrap; }
  .rcard { width:268px; background:var(--panel); border:3px solid var(--line); padding:14px 12px 12px; display:flex; flex-direction:column;
    align-items:center; gap:10px; cursor:default; text-align:center; transition:transform .12s ease-out, border-color .12s; }
  .rcard.pick { cursor:pointer; }
  .rcard.pick:hover { border-color:var(--glow); transform:translateY(-4px); }
  .rcard.picked { border-color:var(--lit); transform:scale(1.08); }
  .rcard.faded { opacity:.25; }
  .rcard.small { width:auto; flex-direction:row; padding:8px 10px; gap:8px; }
  .rcard .tiles { display:flex; justify-content:center; }
  .rcard .tiles .tile { font-size:19px; padding:8px 9px; }
  .rcard .tiles .tile + .tile { margin-left:-3px; }
  .rcard .info { font-size:14px; color:var(--status); min-height:36px; }
  .rcard .verbs { font-size:13px; line-height:1.5; text-align:left; }
  .rcard .verbs b { display:inline-block; width:56px; letter-spacing:.05em; }
  .ctile { width:340px; height:210px; background:var(--panel); border:3px solid var(--glow); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.6); padding:16px; text-align:center;
    transition:transform .12s ease-out; }
  .ctile:hover:not(.off) { transform:translateY(-5px); background:#1e1e2b; }
  .ctile.off { opacity:.3; cursor:default; border-color:var(--line); }
  .ctile .t { font-family:var(--display); font-size:34px; letter-spacing:.04em; }
  .ctile .d { font-size:15px; color:var(--dim); }
  .dicelist { display:flex; flex-direction:column; gap:10px; }
  .dicelist .dl { display:flex; align-items:center; gap:10px; }
  .dicelist .dl .nm { width:64px; font-size:13px; letter-spacing:.2em; color:var(--dim); }
  .dicelist .faces { display:flex; gap:10px; flex-wrap:wrap; }
  .dicelist .f { display:flex; padding:3px; border:2px solid transparent; }
  .dicelist .f.heal { border-color:var(--lit); cursor:pointer; background:color-mix(in srgb, var(--lit) 12%, transparent); }
  .dicelist .f.heal:hover { transform:scale(1.12); }
  .dicelist .f .tile + .tile { margin-left:-2px; }
  .resline { font-size:15px; display:flex; gap:12px; align-items:center; }
  .reslist { max-height:216px; overflow-y:auto; padding-right:6px; display:flex; flex-direction:column; gap:3px; }
  #endLog { width:100%; flex:none; height:104px; overflow-y:auto; font-size:12px; font-weight:400; line-height:1.4; border:2px solid var(--line);
    padding:6px 10px; margin:0; list-style:none; background:var(--panel); user-select:text; }
  #endLog li { border-bottom:1px solid var(--line); padding:1px 0; }
  .pop-in { animation:tilePop .36s cubic-bezier(.2,1.4,.4,1) both; animation-delay:calc(var(--i, 0) * 70ms); }
  @keyframes tilePop { 0% { transform:scale(.3) rotate(-5deg); opacity:0; } 100% { transform:none; opacity:1; } }
  .bagpop { animation:tilePop .3s ease-out both; }


  /* ===== V1-3: placement screen / die nets ===== */
  #pop { z-index:58; }
  #pop .ftip { font-size:12px; font-weight:400; min-width:230px; }
  #pop .ftip .vr { display:flex; gap:10px; align-items:baseline; padding:2px 0; }
  #pop .ftip .vr b { width:52px; letter-spacing:.04em; }
  #pop .ftip .vr .nm { flex:1; }
  #pop .ftip .vr em { font-style:normal; font-weight:700; color:var(--lit); }
  #pop .ftip .sp { margin-top:6px; color:var(--status); max-width:260px; white-space:normal; }
  .plwrap { display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  .plwrap h2 { font-size:34px !important; }
  .plnets { display:flex; gap:40px; justify-content:center; }
  .netbox { display:flex; flex-direction:column; align-items:center; gap:6px; perspective:900px; }
  .nbl { font-family:var(--display); font-weight:400; font-size:20px; letter-spacing:.1em; color:var(--dim); }
  .net { --cw:134px; --ch:92px; --fs:12px; display:grid; grid-template-columns:repeat(4, var(--cw)); grid-template-rows:repeat(3, var(--ch)); gap:6px; transform-style:preserve-3d; }
  .net.mini { --cw:96px; --ch:50px; --fs:9px; gap:4px; }
  .nf { position:relative; border:3px solid var(--line); background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; transition:border-color .1s, background .1s, transform .1s; }
  .nf.p0 { grid-column:2; grid-row:1; } .nf.p1 { grid-column:1; grid-row:2; } .nf.p2 { grid-column:2; grid-row:2; }
  .nf.p3 { grid-column:3; grid-row:2; } .nf.p4 { grid-column:4; grid-row:2; } .nf.p5 { grid-column:2; grid-row:3; }
  .nf .n { position:absolute; left:4px; top:1px; font-size:10px; color:var(--dim); font-weight:400; }
  .nf .tile { font-size:var(--fs); padding:4px 7px; border-width:2px; box-shadow:0 2px 0 rgba(0,0,0,.55); }
  .nf .bp { display:flex; }
  .nf .it { min-height:22px; display:flex; align-items:center; justify-content:center; position:relative; }
  .nf .it.empty { border:2px dashed var(--line); padding:2px 12px; font-size:var(--fs); color:var(--dim); font-weight:400; letter-spacing:.15em; }
  .net.mini .nf { gap:3px; }
  .net.mini .nf .tile { padding:2px 4px; border-width:1px; }
  .net.mini .nf .it { min-height:14px; }
  .net.mini .nf .it.empty { padding:0 6px; border-width:1px; }
  .net.mini .nf .n { display:none; }
  .nf.scar { background:color-mix(in srgb, var(--danger) 8%, var(--panel)); border-color:#5a2a2a; }
  .nf.heal { border-color:var(--lit); cursor:pointer; background:color-mix(in srgb, var(--lit) 12%, var(--panel)); }
  .nf.heal:hover { transform:scale(1.07); }
  .nf .it.movable { cursor:grab; touch-action:none; }
  .nf .it.movable .tile { box-shadow:0 2px 0 rgba(0,0,0,.55), 0 0 0 2px color-mix(in srgb, var(--lit) 70%, transparent); }
  .nf .it.locked { opacity:.55; cursor:not-allowed; }
  .nf .lock { position:absolute; right:-6px; top:-8px; font-size:12px; font-style:normal; filter:grayscale(.3); }
  .nf .new { position:absolute; left:-4px; top:-9px; font-size:9px; background:var(--lit); color:var(--tiletext); padding:0 3px; letter-spacing:.1em; }
  body.dragging-item .nf.valid { border-color:var(--turned); background:color-mix(in srgb, var(--turned) 12%, var(--panel)); }
  body.dragging-item .nf.invalid { opacity:.4; }
  body.dragging-item .nf.over.valid { border-color:var(--lit); background:color-mix(in srgb, var(--lit) 20%, var(--panel)); transform:scale(1.05); }
  .nf.valid.selvalid { border-color:var(--turned); }
  .odds { font-size:13px; font-weight:400; letter-spacing:.03em; color:var(--text); min-height:18px; text-align:center; }
  .odds.hyp { color:var(--lit); }
  .net.mini + .odds { font-size:11px; }
  .invtray { min-width:560px; min-height:74px; border:3px dashed var(--line); background:rgba(255,255,255,.025); padding:8px 12px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  body.dragging-item .invtray.ok { border-color:var(--turned); background:color-mix(in srgb, var(--turned) 8%, transparent); }
  .invtray.over { border-color:var(--lit) !important; }
  .invrow { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; min-height:40px; max-height:96px; overflow-y:auto; align-items:center; max-width:1000px; }
  .inv { display:flex; padding:4px; border:2px solid transparent; cursor:grab; touch-action:none; }
  .inv .tile { font-size:13px; padding:5px 8px; border-width:2px; }
  .inv .tile + .tile { margin-left:-3px; }
  .inv.sel { border-color:var(--lit); background:color-mix(in srgb, var(--lit) 14%, transparent); }
  .inv.dragsrc, .it.dragsrc { opacity:.3; }
  .dragghost { position:fixed; z-index:95; pointer-events:none; left:0; top:0; will-change:transform; }
  .dragghost .tile { font-size:15px; box-shadow:0 10px 0 rgba(0,0,0,.45); }
  .cback { position:absolute; inset:0; z-index:5; background:rgba(5,5,8,.72); display:flex; align-items:center; justify-content:center; }
  .confirm { background:var(--panel); border:3px solid var(--danger); padding:18px 26px; display:flex; flex-direction:column; align-items:center; gap:12px; box-shadow:0 8px 0 rgba(0,0,0,.6); }
  .confirm .ct { font-family:var(--display); font-weight:400; font-size:30px; color:var(--danger); letter-spacing:.06em; }
  .confirm .cd { font-size:15px; display:flex; align-items:center; gap:10px; }
  .confirm .cd .tile { font-size:15px; padding:6px 9px; }
  .confirm .cd s { text-decoration-color:var(--danger); }
  .endnets { display:flex; flex-direction:row; gap:22px; }
  #screen .endcols { max-width:1200px; }
  .endleft { max-width:430px; min-width:300px; }
  .endleft .reslist .resline { white-space:normal; flex-wrap:wrap; row-gap:2px; }
  .net.mini + .odds { max-width:396px; white-space:normal; }
  .endleft .resline.inv { flex-wrap:wrap; }
  .endleft .resline { white-space:nowrap; }
  @keyframes shake2 { 0%,100% { translate:0 } 20% { translate:-7px 0 } 40% { translate:7px 0 } 60% { translate:-5px 0 } 80% { translate:4px 0 } }
  .nf.rej { animation:shake2 .32s linear; border-color:var(--danger) !important; }


  /* ===== V1-5: start screen, map, scavenge site ===== */
  #dayInd { font-size:14px; letter-spacing:.1em; color:var(--sun, #ffd23f); display:none; }
  #dayInd.cold { color:var(--danger); }
  #noiseTrack { display:none; gap:5px; align-items:center; }
  #noiseTrack .nb { width:28px; height:34px; border:3px solid #000; background:#2a2a3a; box-shadow:0 3px 0 rgba(0,0,0,.55); }
  #noiseTrack .nb.on { background:var(--status); }
  #noiseTrack .nb.on.hot { background:var(--danger); }
  #btnLeave { display:none; }
  #stage.site #intentTile { display:none; }
  #stage.site #noiseTrack { display:flex; }
  #stage.site #btnLeave { display:inline-block; }
  #stage.site #intentPanel { width:400px; }
  #stage.site #verbFlash { font-size:20px !important; }
  #stage.site #enemyMeta { flex-wrap:wrap; row-gap:2px; }
  #stage.site #enemyMeta .chip { white-space:nowrap; }
  #stage.site #intentRow { height:48px; align-items:center; }
  .efc.site { cursor:pointer; }
  .efc.site .tile { font-size:12px; padding:8px 4px; white-space:normal; line-height:1.15; min-height:52px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .efc.site.opened { opacity:.5; cursor:default; }
  .efc.site:not(.opened):hover { background:rgba(255,255,255,.05); }
  .efc.site .sfn { position:absolute; right:5px; bottom:2px; font-size:10px; color:var(--dim); font-weight:400; }
  .efc.site .sub { font-size:10px; letter-spacing:.08em; font-weight:400; color:var(--dim); min-height:12px; text-align:center; }
  .efc.site .tile.ghost { outline:2px dashed var(--dim); outline-offset:1px; opacity:.75; }
  .efc.site .tile.strike { text-decoration:line-through; }
  .mapwrap { width:100%; max-width:1200px; display:flex; flex-direction:column; gap:14px; align-items:stretch; }
  .maphead { display:flex; justify-content:space-between; align-items:center; gap:30px; }
  .mh { display:flex; align-items:center; gap:12px; }
  .suns, .scarrow { display:flex; gap:6px; }
  .sun, .stl { width:24px; height:24px; border:3px solid #000; box-shadow:0 3px 0 rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1; color:#000; }
  .sun { background:var(--sun, #ffd23f); }
  .sun.off { background:#2a2a3a; color:var(--dim); }
  .stl { background:#2a2a3a; color:var(--dim); }
  .stl.on { background:var(--scarbg, #3a3a44); color:var(--danger); background-image:repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--danger) 28%, transparent) 5px 7px); }
  .mapgrid { display:grid; grid-template-columns:repeat(6, 1fr); grid-auto-rows:106px; gap:12px; padding-top:6px; }
  .mt { position:relative; border:3px solid #000; box-shadow:0 5px 0 rgba(0,0,0,.6); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; font-family:var(--display); font-weight:400; color:var(--tiletext); text-transform:uppercase; transition:transform .1s ease-out; }
  .mt .ty { font-family:"Courier New", ui-monospace, monospace; font-weight:700; font-size:10px; letter-spacing:.2em; opacity:.65; min-height:11px; }
  .mt .word { line-height:1; letter-spacing:.02em; white-space:nowrap; }
  .mt.fog { color:var(--dim); }
  .mt.fog .word { font-size:34px; }
  .mt.EMPTY { color:var(--dim); }
  .mt.visited:not(.here)::after { content:'✓'; position:absolute; left:6px; top:3px; font-family:"Courier New", monospace; font-size:14px; font-weight:700; color:inherit; opacity:.75; }
  .mt.seen { border-style:dashed; border-color:#bdb48f; }
  .mt.here { outline:4px solid var(--lit); outline-offset:2px; }
  .mt .you { position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:var(--lit); color:#000; border:2px solid #000; font-size:12px; padding:3px 9px; z-index:2; }
  .mt.reach { cursor:pointer; box-shadow:0 0 0 3px var(--glow), 0 5px 0 rgba(0,0,0,.6); }
  .mt.reach.cold { box-shadow:0 0 0 3px var(--danger), 0 5px 0 rgba(0,0,0,.6); }
  .mapfoot { display:flex; align-items:center; gap:16px; min-height:44px; }
  .mapfoot .inv { cursor:default; }
  .mapmsg { font-size:15px; color:var(--status); flex:1; text-align:right; }
  .mapmsg.cold { color:var(--danger); }
  @keyframes revPulse { 0% { box-shadow:0 0 0 0 #bdb48f; transform:scale(1.12); } 100% { box-shadow:0 0 0 12px transparent; transform:scale(1); } }
  .mt.newrev { outline:3px solid var(--turned); outline-offset:-3px; }
  .coldflash { position:absolute; inset:0; z-index:72; pointer-events:none; box-shadow:inset 0 0 120px 30px rgba(255,59,59,.55); }

  /* debug / tuning drawer (overlay on the right, closed by default) */
  #btnDebug { background:transparent; border:2px solid var(--line); padding:2px 8px; font-size:12px; letter-spacing:.1em; color:var(--dim); }
  #btnDebug.on { border-color:var(--status); color:var(--status); }
  #dbg { position:absolute; right:0; top:40px; bottom:0; width:300px; z-index:90; background:rgba(10,10,16,.97);
    border-left:2px solid var(--status); padding:10px 12px 12px; overflow-y:auto; font-size:12px; font-weight:400;
    transform:translateX(100%); transition:transform .15s ease-out; visibility:hidden; }
  #dbg.open { transform:none; visibility:visible; }
  #dbg h4 { margin:12px 0 5px; font-size:11px; letter-spacing:.2em; color:var(--status); font-weight:700; }
  #dbg h4:first-child { margin-top:0; }
  #dbg .row { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  #dbg .row label { flex:none; width:48px; color:var(--dim); }
  #dbg select { flex:1; min-width:0; background:#000; color:var(--text); border:1px solid var(--line); font:inherit; padding:3px; }
  #dbg .dbtn { background:#1d1d2a; border:1px solid #55556e; color:var(--text); padding:4px 8px; font-size:12px; font-weight:700; }
  #dbg .dbtn:hover:not(:disabled) { border-color:var(--status); }
  #dbg button:disabled, #dbg select:disabled { opacity:.35; cursor:not-allowed; }
  #dbg .chk { display:flex; gap:8px; align-items:center; cursor:pointer; margin-bottom:6px; }
  #dbgNote { color:var(--dim); font-size:11px; margin:4px 0 0; min-height:14px; }
  #dbgLog { margin:0; padding:0; list-style:none; line-height:1.35; }
  #dbgLog li { padding:3px 0; border-bottom:1px solid var(--line); color:var(--text); word-break:break-word; }
  #dbgLog li:first-child { color:var(--status); }
</style>
</head>
<body>
<div id="stage">
  <header id="top"><span class="title" id="titleLabel">SMUGGLER</span><span id="stageInd"></span><span id="turn"></span><span class="spacer"></span><span id="dayInd"></span><span id="invCount"></span><span id="scars"></span></header>
  <section id="enemy">
    <div id="intentPanel">
      <div class="lbl" id="enemyLbl">STRAY DOG · INTENT</div>
      <div id="enemyMeta"></div>
      <div id="bag" class="hidden"></div>
      <div id="intentRow"><span id="intentTile" class="tile"></span><div id="noiseTrack"></div><span id="verbFlash" style="font-size:28px;white-space:nowrap"></span></div>
      <div id="intentText"></div>
      <div id="enemyText"></div>
      <div id="nextWrap" class="hidden"></div>
    </div>
    <div id="faceStrip"></div>
  </section>
  <section id="sentence">
    <div id="slots"></div>
    <div id="preview"><div id="shape"></div><div id="previewText"></div></div>
  </section>
  <section id="bottom">
    <div id="tray"></div>
    <div id="buttons">
      <button class="btn primary" id="btnRoll">ROLL</button>
      <button class="btn" id="btnReroll">REROLL (0 left)</button>
      <button class="btn primary" id="btnCommit">COMMIT</button>
      <button class="btn" id="btnLeave">LEAVE</button>
      <button class="btn" id="btnRestart">RESTART</button>
      <span id="status"></span>
    </div>
  </section>
  <div id="help"></div>
  <div id="screen"></div>
  <div id="pop"></div>
  <div id="overlay"><div class="big" id="ovBig"></div><div class="sub" id="ovSub"></div><button class="btn primary" id="ovRestart">CONTINUE</button></div>
</div>

<script>
/* CONFIG START */
const CONFIG = {
  rerollsPerTurn: 2,
  maxScars: 4,                                        // trip is lost when total scars >= this
  points: { favourite: 2, other: 1, itemBonus: 1, scar: 0 },
  favouriteVerb: { HAND: 'PRUNE', MOUTH: 'SOW', EYE: 'DIG' },
  verbs: ['PRUNE', 'SOW', 'DIG'],
  revealVerb: 'DIG',                                  // verb that reveals the next intent and carries points
  pipResult: { PRUNE: 'broken', SOW: 'turned' },      // damage verbs -> what they do to a pip
  modKey: { PRUNE: 'pruneMod', SOW: 'sowMod' },       // damage verb -> enemy field added once to that verb's sentence total
  // Starting dice are bare; the kit sits in the inventory and is placed on the intro screen.
  playerDice: [
    { id: 'MIND', faces: ['PRUNE', 'PRUNE', 'SOW', 'SOW', 'DIG', 'DIG'] },
    { id: 'HAND', faces: ['HAND', 'HAND', 'HAND', 'HAND', 'HAND', 'HAND'] },
    { id: 'HEAD', faces: ['EYE', 'EYE', 'EYE', 'MOUTH', 'MOUTH', 'MOUTH'] },
  ],
  startingInventory: ['KNIFE', 'GLASSES'],
  mindDieId: 'MIND',
  headDieId: 'HEAD',                                  // scarHead hits this die
  itemDice: ['HAND', 'HEAD'],                         // dice that can hold items (and show in placement)
  biteTargets: ['HAND', 'HEAD'],                      // dice ids a scar / item-taking effect may hit
  shapeNames: ['Plan', 'Situation', 'Impulse'],       // by MIND slot 0/1/2
  actionNames: {                                      // bare body parts only: [bodyPart][verb]; item faces use items[id].names
    'HAND':  { PRUNE: 'Hit',    SOW: 'Gesture',    DIG: 'Search' },
    'MOUTH': { PRUNE: 'Insult', SOW: 'Small talk', DIG: 'Ask' },
    'EYE':   { PRUNE: 'Glare',  SOW: 'Kind look',  DIG: 'Look' },
  },
  // Items: part, a name per verb, a `special` code the engine switches on, and `info` shown in tooltips.
  // Numbers for the specials live in itemRules. Every item also gives points.itemBonus.
  items: {
    KNIFE:        { name: 'KNIFE',        part: 'HAND',  names: { PRUNE: 'Stab',              SOW: 'Threaten',        DIG: 'Pry' },
                    special: 'knife',       info: 'PRUNE: +1 extra point' },
    SHEARS:       { name: 'SHEARS',       part: 'HAND',  names: { PRUNE: 'Snip',              SOW: 'Offer to trim',   DIG: 'Cut open' },
                    special: 'shears',      info: 'PRUNE: its points are split across 2 different faces. On a scavenge site, PRUNE with SHEARS makes no noise' },
    SPADE:        { name: 'SPADE',        part: 'HAND',  names: { PRUNE: 'Whack',             SOW: 'Lean and chat',   DIG: 'Dig' },
                    special: 'spade',       info: 'DIG on a scavenge site: reveals all faces' },
    WATERING_CAN: { name: 'WATERING CAN', part: 'HAND',  names: { PRUNE: 'Splash',            SOW: 'Water their plant', DIG: 'Flood out' },
                    special: 'wateringCan', info: 'SOW: also applies +1 SOW automatically at the start of your next turn' },
    SEED_POUCH:   { name: 'SEED POUCH',   part: 'HAND',  names: { PRUNE: 'Seeds in the eyes', SOW: 'Give seeds',      DIG: 'Read the soil' },
                    special: 'seedPouch',   info: 'SOW: each enemy face fully turned by this sentence gives +1 reroll next turn' },
    GLASSES:      { name: 'GLASSES',      part: 'EYE',   names: { PRUNE: 'Glint',             SOW: 'Look learned',    DIG: 'Read closely' },
                    special: 'glasses',     info: 'DIG: reveals the next 2 enemy intents' },
    LANTERN:      { name: 'LANTERN',      part: 'EYE',   names: { PRUNE: 'Dazzle',            SOW: 'Warm light',      DIG: 'Light up' },
                    special: 'lantern',     info: 'This eye face counts as matching (2 points) under any verb' },
    WHISTLE:      { name: 'WHISTLE',      part: 'MOUTH', names: { PRUNE: 'Shriek',            SOW: 'Call softly',     DIG: 'Echo' },
                    special: 'whistle',     info: 'SOW vs animals: this die\'s points ×2' },
    PIPE_WRENCH:  { name: 'PIPE WRENCH',  part: 'HAND',  names: { PRUNE: 'Wrench',            SOW: 'Fix their tap',   DIG: 'Unscrew' },
                    special: 'wrench',      info: 'Sturdy: this face cannot be scarred and its item cannot be taken' },
    PLUNGER:      { name: 'PLUNGER',      part: 'HAND',  names: { PRUNE: 'Plunge',            SOW: 'Unclog their worries', DIG: 'Suck out' },
                    special: 'plunger',     info: 'DIG: also removes 1 pip (as turned) from the enemy\'s current intent. On a site: from the target face, no noise' },
  },
  itemRules: {
    knifePruneBonus: 1,            // KNIFE, PRUNE
    glassesRevealDepth: 2,         // GLASSES, DIG: intents revealed (other DIG = 1)
    defaultRevealDepth: 1,
    whistleMultiplier: 2,          // WHISTLE, SOW vs enemy tag whistleTag
    whistleTag: 'animal',
    wateringCanSow: 1,             // WATERING CAN, SOW: pending SOW applied at the start of the next turn
    seedPouchRerollPerTurned: 1,   // SEED POUCH, SOW: rerolls next turn per enemy face turned this sentence
    plungerPips: 1,                // PLUNGER, DIG: pips turned on the current intent face (site: the target face)
    wrenchSpecial: 'wrench',       // PIPE WRENCH: the face can't be scarred and its item can't be taken
  },
  // Enemy effect numbers. tax: every verb total of the sentence is reduced by this next turn (min 0, not stacking).
  effectRules: { tax: 1 },
  // Enemies: tags, pruneMod / sowMod (added once to that verb's sentence total, min 0), 6 faces with pips,
  // flavour text (read as "<logName> <text>"), rewards per ending.
  //   effect: 'scar' (random non-scar HAND/HEAD face -> SCAR, its item is destroyed) | 'rerollPenalty' (-1 reroll next turn)
  //           | 'takeItem' (random placed item goes to the enemy; returned if beaten) | 'none'
  //           | 'loseItem' (a random placed item is removed for good, never returned)
  //           | 'scarHead' (scar a random HEAD face) | 'tax' (next turn every verb total -1) | 'freezeDie' (a random non-MIND die can't be held/rerolled next turn)
  //   (a face holding a wrench item is never scarred and never taken from)
  //   rewards: { choose:[ids] } pick one, { give:[ids] } all; returnTaken:true gives back taken items; revealTiles is M2.
  enemies: {
    DOG: {
      name: 'STRAY DOG', logName: 'dog', tags: ['animal'], pruneMod: 0, sowMod: 0,
      faces: [
        { name: 'BITE',    pips: 4, hostile: true,  effect: 'scar' },
        { name: 'BITE',    pips: 4, hostile: true,  effect: 'scar' },
        { name: 'GROWL',   pips: 4, hostile: true,  effect: 'rerollPenalty' },
        { name: 'GROWL',   pips: 4, hostile: true,  effect: 'rerollPenalty' },
        { name: 'SNIFF',   pips: 4, hostile: true,  effect: 'none' },
        { name: 'WHIMPER', pips: 4, hostile: false, effect: 'none' },
      ],
      targetPriority: ['BITE', 'GROWL', 'SNIFF'],     // order for spilling PRUNE/SOW past the current intent
      text: { BITE: 'bites', GROWL: 'growls (−1 reroll next turn)', SNIFF: 'sniffs your pockets', WHIMPER: 'whimpers',
              wag: 'wags its tail', broken: 'is too hurt to act' },
      rewards: { beaten: { choose: ['WHISTLE', 'SPADE'] }, befriended: { choose: ['WHISTLE', 'LANTERN'], revealTiles: 4 } },
      winText: { beaten: 'The dog is done for.', befriended: 'The dog is yours now.' },
    },
    PLUMBER: {
      name: 'PLUMBER', logName: 'plumber', tags: ['human'], pruneMod: -1, sowMod: 1,
      faces: [
        { name: 'BORROW', pips: 6, hostile: true,  effect: 'takeItem' },
        { name: 'BORROW', pips: 6, hostile: true,  effect: 'takeItem' },
        { name: 'QUOTE',  pips: 2, hostile: true,  effect: 'rerollPenalty' },
        { name: 'QUOTE',  pips: 2, hostile: true,  effect: 'rerollPenalty' },
        { name: 'SIGH',   pips: 2, hostile: false, effect: 'none' },
        { name: 'SIGH',   pips: 2, hostile: false, effect: 'none' },
      ],
      targetPriority: ['BORROW', 'QUOTE'],
      text: { BORROW: 'borrows your {item}', QUOTE: 'quotes an outrageous price (−1 reroll next turn)', SIGH: 'sighs and shakes his head',
              noItem: 'rummages through your things, finds nothing worth borrowing', wag: 'tips his cap', broken: 'is too hurt to act' },
      rewards: { beaten: { give: ['PIPE_WRENCH'], returnTaken: true }, befriended: { choose: ['PLUNGER', 'WATERING_CAN'] } },
      winText: { beaten: 'The plumber leaves, rubbing his bruises.', befriended: 'The plumber shakes your hand and stays for tea.' },
    },
    ACCOUNTANT: {
      name: 'ACCOUNTANT', logName: 'accountant', tags: ['human'], pruneMod: 1, sowMod: -1,
      faces: [
        { name: 'TAXES',    pips: 4, hostile: true,  effect: 'tax' },
        { name: 'TAXES',    pips: 4, hostile: true,  effect: 'tax' },
        { name: 'EXPLAINS', pips: 6, hostile: true,  effect: 'scarHead' },
        { name: 'BORES',    pips: 2, hostile: true,  effect: 'rerollPenalty' },
        { name: 'ANECDOTE', pips: 4, hostile: true,  effect: 'freezeDie' },
        { name: 'FILES',    pips: 2, hostile: false, effect: 'none' },
      ],
      targetPriority: ['EXPLAINS', 'TAXES', 'ANECDOTE', 'BORES'],
      text: { TAXES: 'talks about taxes (next turn: every verb −1)', EXPLAINS: 'explains depreciation; your eyes glaze over',
              BORES: 'tells you about his weekend (−1 reroll next turn)', ANECDOTE: 'starts an anecdote (a die freezes up)',
              FILES: 'shuffles his files', wag: 'adjusts his glasses', broken: 'is too hurt to act' },
      rewards: { beaten: { choose: ['LANTERN', 'GLASSES'] }, befriended: { choose: ['WHISTLE', 'SEED_POUCH'] } },
      winText: { beaten: 'The accountant flees to a quieter office.', befriended: 'The accountant waves goodbye, his spreadsheet lighter.' },
    },
    BRIDGE: {
      name: 'WOODEN BRIDGE', logName: 'bridge', tags: ['place'], pruneMod: 0, sowMod: 0,
      resultLabels: { beaten: 'FORCED ACROSS', befriended: 'CROSSED SAFELY' },   // shown instead of BEATEN / BEFRIENDED
      faces: [
        { name: 'CREAK',      pips: 4, hostile: true,  effect: 'rerollPenalty' },
        { name: 'CREAK',      pips: 4, hostile: true,  effect: 'rerollPenalty' },
        { name: 'SLIP',       pips: 4, hostile: true,  effect: 'scar' },
        { name: 'DROP',       pips: 6, hostile: true,  effect: 'loseItem' },
        { name: 'SWAY',       pips: 2, hostile: true,  effect: 'rerollPenalty' },
        { name: 'CALM WATER', pips: 2, hostile: false, effect: 'none' },
      ],
      targetPriority: ['DROP', 'SLIP', 'CREAK', 'SWAY'],
      text: { CREAK: 'the planks creak (−1 reroll next turn)', SLIP: 'you slip on wet wood', DROP: 'something falls into the river',
              SWAY: 'the bridge sways (−1 reroll next turn)', 'CALM WATER': 'the water flows quietly',
              noItem: 'something almost falls into the river', wag: 'the planks hold steady', broken: 'the planks are splintered' },
      rewards: { beaten: { give: [] }, befriended: { choose: ['LANTERN', 'WATERING_CAN'] } },
      winText: { beaten: 'You force your way across, planks cracking.', befriended: 'You cross, step by careful step.' },
    },
    CROWS: {
      name: 'CROW FLOCK', logName: 'crows', tags: ['animal'], pruneMod: 1, sowMod: -2,
      faces: [
        { name: 'PECK',   pips: 2, hostile: true,  effect: 'scar' },
        { name: 'PECK',   pips: 2, hostile: true,  effect: 'scar' },
        { name: 'CAW',    pips: 2, hostile: true,  effect: 'rerollPenalty' },
        { name: 'STEAL',  pips: 4, hostile: true,  effect: 'takeItem' },
        { name: 'CIRCLE', pips: 2, hostile: false, effect: 'none' },
        { name: 'CIRCLE', pips: 2, hostile: false, effect: 'none' },
      ],
      targetPriority: ['PECK', 'STEAL', 'CAW'],
      text: { PECK: 'pecks!', CAW: 'caws (−1 reroll next turn)', STEAL: 'steals from you', CIRCLE: 'circles overhead',
              noItem: 'finds nothing shiny', wag: 'settles on a branch', broken: 'is too hurt to act' },
      rewards: { beaten: { give: ['LANTERN'], returnTaken: true }, befriended: { choose: ['GLASSES', 'KNIFE'] } },
      winText: { beaten: 'The crows scatter.', befriended: 'The crows land on your shoulder.' },
    },
  },
  // Trip: M1 sequence of encounters; campfire id is the rest stop. singleFight is what the v0 single-fight UI plays.
  // M1 = m1Fights distinct random enemies from enemyPool with the campfire after fight number campfireAfter
  // (rolled at createTrip). M2 character tiles pick from the same pool.
  // V1-4c: M1 = m1Events distinct draws from m1Pool (fights, obstacle, sites) with the campfire after event campfireAfter.
  // enemyPool = every enemy id a map CHARACTER tile can hold (sites come from CONFIG.sites).
  trip: { enemyPool: ['DOG', 'PLUMBER', 'CROWS', 'ACCOUNTANT', 'BRIDGE'],
          m1Pool: ['DOG', 'PLUMBER', 'CROWS', 'ACCOUNTANT', 'BRIDGE', 'HUT'], m1Events: 5, campfireAfter: 3,
          campfireId: 'CAMPFIRE', singleFight: 'DOG', healPerCampfire: 1,
          mapStage: 'MAP', siteStage: 'SITE',            // M2 trip.stage values besides enemy ids / campfireId
          unknownLabel: '?',                             // future fights in the stage strip
          stageLabels: { DOG: 'DOG', PLUMBER: 'PLUMBER', ACCOUNTANT: 'ACCOUNTANT', BRIDGE: 'BRIDGE', HUT: 'HUT', CAMPFIRE: 'FIRE', CROWS: 'CROWS' } },   // top-bar stage indicator
  // ---------- M2: map, daylight, scavenge sites ----------
  // Tile weights, size, daylight. START = column 0, row startRow (default floor((rows-1)/2)); GATE = last column, random row.
  // campfireCols = [first, last] column (0-indexed) that must hold at least one CAMPFIRE.
  map: {
    cols: 6, rows: 4, daylight: 8, daylightPerMove: 1, coldScarsPerMove: 1, startRow: null, campfireCols: [1, 3],
    weights: { CHARACTER: 35, SCAVENGE: 30, CAMPFIRE: 10, EMPTY: 25 },
    gateVisible: false,                                   // true = the GATE tile is never fogged

// Pure game rules. No DOM, no timers, RNG injected. State may be mutated in place.
(function () {
  // ---------- helpers ----------
  function makeRng(seed) {                             // mulberry32
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  function randInt(rng, n) { return Math.min(n - 1, Math.floor(rng() * n)); }
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (o[k] !== undefined ? o[k] : m));
  const signed = (n) => (n < 0 ? '−' : '+') + Math.abs(n);

  const SCAR = CONFIG.text.scar;                       // face key of a scarred face
  const RULES = CONFIG.itemRules;

  // ---------- faces & scoring ----------
  // -> { face, kind: 'verb'|'body'|'scar', verb, body, item }
  function parseFace(face) {
    if (face === SCAR) return { face, kind: 'scar', verb: null, body: null, item: null };
    if (CONFIG.verbs.indexOf(face) >= 0) return { face, kind: 'verb', verb: face, body: null, item: null };
    const i = face.indexOf('+');
    return { face, kind: 'body', verb: null, body: i < 0 ? face : face.slice(0, i), item: i < 0 ? null : face.slice(i + 1) };
  }
  const hasTag = (enemy, tag) => !!(enemy && enemy.tags && enemy.tags.indexOf(tag) >= 0);

  // Full scoring of one body face performing `verb`: own points (before carry) + the item special that triggered.
  // ctx = { enemy?, site? }. -> { own, base, notes:[string], flags:{knife,lantern,whistle,shears,wateringCan,seeds,glasses,spade}, depth }
  function scoreDetail(p, verb, ctx) {
    ctx = ctx || {};
    const out = { own: 0, notes: [], flags: {}, depth: 0 };
    if (p.kind === 'scar') return out;
    if (p.kind !== 'body') return out;
    const sp = specialOf(p.item);
    let fav = CONFIG.favouriteVerb[p.body] === verb;
    if (sp === 'lantern') fav = true;                   // a lantern eye counts as matching under any verb
    let pts = fav ? CONFIG.points.favourite : CONFIG.points.other;
    if (p.item) pts += CONFIG.points.itemBonus;
    const note = (key, n) => out.notes.push(fmt(CONFIG.notes[key], { n }));
    if (sp === 'knife' && verb === 'PRUNE') { pts += RULES.knifePruneBonus; out.flags.knife = true; note('knife', RULES.knifePruneBonus); }
    if (sp === 'lantern' && verb !== CONFIG.revealVerb) { out.flags.lantern = true; note('lantern', 0); }
    if (sp === 'whistle' && verb === 'SOW' && !ctx.site && hasTag(ctx.enemy, RULES.whistleTag)) {
      pts *= RULES.whistleMultiplier; out.flags.whistle = true; note('whistle', RULES.whistleMultiplier);
    }
    out.own = pts;
    if (sp === 'shears' && verb === 'PRUNE') { out.flags.shears = true; note('shears', 0); }
    if (sp === 'wateringCan' && verb === 'SOW') { out.flags.wateringCan = true; note('wateringCan', RULES.wateringCanSow); }
    if (sp === 'seedPouch' && verb === 'SOW') { out.flags.seeds = true; note('seeds', 0); }
    if (verb === CONFIG.revealVerb) {
      out.depth = RULES.defaultRevealDepth;
      if (sp === 'glasses') { out.depth = RULES.glassesRevealDepth; out.flags.glasses = true; note('glasses', out.depth); }
      if (sp === 'spade' && ctx.site) { out.flags.spade = true; note('spade', 0); }
      if (sp === 'plunger') { out.flags.plunger = true; note('plunger', RULES.plungerPips); }

  function scoreBodyFace(face, verb, ctx) {

    if (p.kind === 'scar') return CONFIG.points.scar;
    return scoreDetail(p, verb, ctx).own;
  }

  function actionName(p, verb) {

    if (d && d.names && d.names[verb]) return d.names[verb];

    return a && a[verb] ? a[verb] : p.face + ' ' + verb;
  }

  // faces = 3 face strings in slot order (exactly one verb face). ctx = { enemy?, site? }:
  // enemy supplies tags (WHISTLE) and pruneMod / sowMod; omit it for a context-free preview.
  function evaluateSentence(faces, ctx) {

    const enemy = ctx.site ? null : (ctx.enemy || null);
    const parsed = faces.map(parseFace);
    const verbSlots = [];

    if (verbSlots.length !== 1) throw new Error('sentence needs exactly one verb face, got ' + verbSlots.length);
    const mindIndex = verbSlots[0];
    const verb = parsed[mindIndex].verb;
    const shape = CONFIG.shapeNames[mindIndex];

    const steps = [];
    const totals = {};
    Object.keys(CONFIG.pipResult).forEach(v => { totals[v] = 0; });
    const order = [];            // damage verbs by first appearance
    const carryAfter = [];       // is a carry in flight after this step?

      if (i === mindIndex) return;
      if (p.kind === 'scar') {
        steps.push({ slot: i, face: p.face, role: 'scar', verb: null, base: CONFIG.points.scar, carryIn: 0,
          total: 0, reveal: false, passesTo: null, name: CONFIG.text.scar, item: null, notes: [], depth: 0 });
        carryAfter.push(carry > 0);
        return;
      }
      const role = i < mindIndex ? 'instinct' : 'directed';
      const v = role === 'instinct' ? CONFIG.favouriteVerb[p.body] : verb;
      const det = scoreDetail(p, v, { enemy, site: !!ctx.site });
      const base = det.own;
      const carryIn = carry;
      const total = base + carryIn;
      carry = 0;
      let stepReveal = false, passesTo = null;
      if (v === CONFIG.revealVerb) {

        revealDepth = Math.max(revealDepth, det.depth);
        if (det.flags.plunger) plungerPips += RULES.plungerPips;
        for (let j = i + 1; j < parsed.length; j++) {

    const taxed = {};
    const tax = !ctx.site && enemy ? (ctx.tax || 0) : 0;
    if (tax) order.forEach(v => {
      const before = totals[v];
      if (before <= 0) return;
      totals[v] = Math.max(0, before - tax);
