    let stepsText = '';
    steps.forEach((s, k) => {
      let str = s.name + ' ' + s.base + (s.carryIn > 0 ? '+' + s.carryIn : '');
      if (s.reveal) str += ' ' + CONFIG.text.reveal;
      s.notes.forEach(n => { str += ' (' + n + ')'; });
      stepsText += str;
      if (k < steps.length - 1) stepsText += carryAfter[k] ? ' → ' : ' · ';
    });
    const parts = order.map(v => v + ' ' + totals[v] + (mods[v] ? ' (' + mods[v].source + ' ' + signed(mods[v].mod) + ')' : '') +
      (taxed[v] ? ' (' + fmt(CONFIG.notes.taxed, { n: taxed[v].amount }) + ')' : ''));
    const totalsText = parts.length ? parts.join(' · ') : CONFIG.text.noEffect;
    return { shape, mindIndex, verb, steps, totals, order, reveal, revealDepth, mods, taxed, shears, seeds, pendingSow, plungerPips, totalsText,
      text: shape + ': ' + stepsText + ' → ' + totalsText };
  }

  // ---------- player ----------
  // die: { id, faces: [...6 strings], idx: current face index, held }
  function makeDice() { return CONFIG.playerDice.map(d => ({ id: d.id, faces: d.faces.slice(), idx: 0, held: false })); }
  function createPlayer() { return { dice: makeDice() }; }
  function currentFace(die) { return die.faces[die.idx]; }
  function rollDie(die, rng) { die.idx = randInt(rng, die.faces.length); return die.idx; }
  function toggleHold(die) { if (die.frozen) return die.held; die.held = !die.held; return die.held; }   // a frozen die can't be held
  // Rerolls every un-held die and spends one reroll. Returns rerolled die ids, or null if none left.
  function rerollUnheld(state, rng) {
    if (state.rerolls <= 0) return null;
    state.rerolls -= 1;
    const ids = [];
    state.player.dice.forEach(d => { if (!d.held && !d.frozen) { rollDie(d, rng); ids.push(d.id); } });
    return ids;
  }
  // A face holding a wrench item can't be scarred and its item can't be taken.
  const isSturdy = (faceStr) => { const p = parseFace(faceStr); return !!p.item && specialOf(p.item) === RULES.wrenchSpecial; };
  function countScars(player) {
    let n = 0;
    player.dice.forEach(d => d.faces.forEach(f => { if (f === SCAR) n++; }));
    return n;
  }

  // ---------- enemy ----------
  // intent: { faceIdx, wag } ; face: { name, pips: ['intact'|'broken'|'turned', ...], hostile, effect }
  function createEnemy(id, rng) {
    if (typeof id === 'function') { rng = id; id = CONFIG.trip.singleFight; }
    id = id || CONFIG.trip.singleFight;
    const c = CONFIG.enemies[id];
    if (!c) throw new Error('unknown enemy ' + id);
    const e = {
      id, name: c.name, logName: c.logName || c.name, tags: c.tags.slice(), pruneMod: c.pruneMod || 0, sowMod: c.sowMod || 0,
      targetPriority: c.targetPriority.slice(), text: c.text, winText: c.winText,
      resultLabels: Object.assign({ beaten: CONFIG.text.beaten, befriended: CONFIG.text.befriended }, c.resultLabels || {}),
      faces: c.faces.map(f => ({ name: f.name, pips: Array(f.pips).fill('intact'), hostile: !!f.hostile, effect: f.effect || 'none' })),
      current: null,
      upcoming: [],       // pre-rolled future intents (index 0 = the next turn's intent)
      shown: 0,           // how many `upcoming` entries the player can see right now
      foresight: 0,       // reveal depth earned this turn; consumed at the turn transition
      next: null,         // derived: upcoming[0] while visible (kept for the single-fight UI)
    };
    if (rng) e.current = rollIntent(e, rng);
    return e;
  }
  function faceStatus(face) {
    let intact = 0, broken = 0, turned = 0;
    face.pips.forEach(p => { if (p === 'intact') intact++; else if (p === 'broken') broken++; else turned++; });
    if (intact === face.pips.length) return 'intact';
    if (intact > 0) return 'damaged';
    return broken > turned ? 'broken' : 'turned';
  }
  function isResolved(face) { const s = faceStatus(face); return s === 'broken' || s === 'turned'; }
  function isHostile(face) { return !!face.hostile; }

  // Unresolved hostile faces in targeting order: current intent first, then targetPriority, ties by index.
  function targetOrder(enemy) {
    const out = [];
    const cur = enemy.current;
    if (cur && !cur.wag) {
      const f = enemy.faces[cur.faceIdx];
      if (isHostile(f) && !isResolved(f)) out.push(cur.faceIdx);
    }
    const prio = enemy.targetPriority;
    enemy.faces
      .map((f, i) => ({ f, i }))
      .filter(o => isHostile(o.f) && !isResolved(o.f) && out.indexOf(o.i) < 0)
      .sort((a, b) => (prio.indexOf(a.f.name) - prio.indexOf(b.f.name)) || (a.i - b.i))
      .forEach(o => out.push(o.i));
    return out;
  }
  // Spend `amount` points of `verb` (PRUNE/SOW) on intact pips. Returns ordered events.
  // opts.alternate = n: the first n points alternate between the first two eligible faces (SHEARS); pip events get shears:true.
  function applyVerb(enemy, verb, amount, opts) {
    const to = CONFIG.pipResult[verb];
    const events = [];
    if (!to || amount <= 0) return events;
    let left = amount;
    const spend = (fi, shears) => {
      const face = enemy.faces[fi];
      const pi = face.pips.indexOf('intact');
      face.pips[pi] = to;
      left--;
      const ev = { type: 'pip', faceIdx: fi, pipIdx: pi, to, verb };
      if (shears) ev.shears = true;
      events.push(ev);
      if (isResolved(face)) events.push({ type: 'faceResolved', faceIdx: fi, resolved: faceStatus(face) });
    };
    let alt = Math.min((opts && opts.alternate) || 0, amount), last = -1;
    while (alt > 0 && left > 0) {
      const pair = targetOrder(enemy).slice(0, 2);
      if (!pair.length) break;
      const fi = pair.length === 2 && pair[0] === last ? pair[1] : pair[0];
      spend(fi, true); last = fi; alt--;
    }
    for (const fi of targetOrder(enemy)) {
      while (left > 0 && enemy.faces[fi].pips.indexOf('intact') >= 0) spend(fi, false);
      if (left <= 0) break;
    }
    return events;
  }

  // Pick a random non-broken face. Turned face => wag intent.
  function rollIntent(enemy, rng) {
    let idxs = [];
    enemy.faces.forEach((f, i) => { if (faceStatus(f) !== 'broken') idxs.push(i); });
    if (!idxs.length) return { faceIdx: 0, wag: true };
    const faceIdx = idxs[randInt(rng, idxs.length)];
    return { faceIdx, wag: faceStatus(enemy.faces[faceIdx]) === 'turned' };
  }
  const copyIntent = (i) => (i ? { faceIdx: i.faceIdx, wag: i.wag } : null);
  const shownList = (enemy) => enemy.upcoming.slice(0, enemy.shown).map(i => ({ intent: copyIntent(i), face: enemy.faces[i.faceIdx].name }));
  function syncNext(enemy) { enemy.next = enemy.shown > 0 && enemy.upcoming.length ? copyIntent(enemy.upcoming[0]) : null; }
  // Reroll upcoming intents sitting on broken faces; refresh wag flags. -> true if any intent was rerolled
  function refreshUpcoming(enemy, rng) {
    let changed = false;
    enemy.upcoming = enemy.upcoming.map(it => {
      const st = faceStatus(enemy.faces[it.faceIdx]);
      if (st === 'broken') { changed = true; return rollIntent(enemy, rng); }
      return { faceIdx: it.faceIdx, wag: st === 'turned' };
    });
    return changed;
  }
  function ensureUpcoming(enemy, n, rng) { while (enemy.upcoming.length < n) enemy.upcoming.push(rollIntent(enemy, rng)); }

  // Resolves the enemy's current intent against the encounter state. Returns { events, rerollPenalty }.
  function enemyAct(state, rng) {
    const enemy = state.enemy, intent = enemy.current;
    const face = enemy.faces[intent.faceIdx];
    const status = faceStatus(face);
    const T = enemy.text;
    const base = { type: 'enemyAct', intent: { faceIdx: intent.faceIdx, wag: intent.wag }, face: face.name };
    const out = { events: [], rerollPenalty: 0 };
    if (intent.wag || status === 'turned') {
      out.events.push(Object.assign(base, { skipped: true, reason: 'wag', effect: null, anim: 'wag', text: T.wag }));
      return out;
    }
    if (status === 'broken') {
      out.events.push(Object.assign(base, { skipped: true, reason: 'broken', effect: null, anim: 'broken', text: T.broken }));
      return out;
    }
    const ev = Object.assign(base, { skipped: false, reason: null, effect: face.effect, anim: face.name.toLowerCase(), text: T[face.name] || '' });
    out.events.push(ev);
    const holders = (needItem, onlyDie) => {
      const c = [];
      state.player.dice.forEach(d => {
        if (CONFIG.biteTargets.indexOf(d.id) < 0) return;
        if (onlyDie && d.id !== onlyDie) return;
        d.faces.forEach((f, fi) => {
          if (f === SCAR || isSturdy(f)) return;
          if (needItem && !parseFace(f).item) return;
          c.push({ d, fi });
        });
      });
      return c;
    };
    if (face.effect === 'scar' || face.effect === 'scarHead') {
      const cands = holders(false, face.effect === 'scarHead' ? CONFIG.headDieId : null);
      if (cands.length) {
        const c = cands[randInt(rng, cands.length)];
        const previous = c.d.faces[c.fi];
        c.d.faces[c.fi] = SCAR;
        out.events.push({ type: 'scar', dieId: c.d.id, faceIdx: c.fi, previous, wasCurrent: c.d.idx === c.fi, by: face.name });
        const item = parseFace(previous).item;
        if (item) out.events.push({ type: 'itemDestroyed', dieId: c.d.id, faceIdx: c.fi, item, cause: 'scar',
          by: face.name, wasCurrent: c.d.idx === c.fi });
      }
    } else if (face.effect === 'rerollPenalty') {
      ev.rerollPenalty = 1;
      state.rerollPenalty = 1;
      out.rerollPenalty = 1;
    } else if (face.effect === 'tax') {
      ev.tax = CONFIG.effectRules.tax;
      state.tax = CONFIG.effectRules.tax;                 // next turn only, not stacking
    } else if (face.effect === 'freezeDie') {
      const dice = state.player.dice.filter(d => d.id !== CONFIG.mindDieId);
      if (dice.length) {
        const d = dice[randInt(rng, dice.length)];
        d.frozen = true;                                  // cleared when the next sentence is committed / the encounter ends
        ev.frozenDie = d.id;
        out.events.push({ type: 'freeze', dieId: d.id, by: face.name });
      }
    } else if (face.effect === 'loseItem') {
      const cands = holders(true);
      if (cands.length) {
        const c = cands[randInt(rng, cands.length)];
        const previous = c.d.faces[c.fi];
        const item = parseFace(previous).item;
        c.d.faces[c.fi] = parseFace(previous).body;
        if (state.trip) state.trip.discarded.push(item);           // gone for good: not in `taken`, never returned
        ev.text = fmt(ev.text, { item: CONFIG.items[item].name.toLowerCase() });
        out.events.push({ type: 'itemDestroyed', dieId: c.d.id, faceIdx: c.fi, item, cause: 'river', by: face.name,
          becomes: c.d.faces[c.fi], previous, wasCurrent: c.d.idx === c.fi });
      } else {
        ev.text = T.noItem || ev.text;
        ev.nothing = true;
      }
    } else if (face.effect === 'takeItem') {
      const cands = holders(true);
      if (cands.length) {
        const c = cands[randInt(rng, cands.length)];
        const previous = c.d.faces[c.fi];
        const item = parseFace(previous).item;
        c.d.faces[c.fi] = parseFace(previous).body;
        state.taken.push(item);
        ev.text = fmt(ev.text, { item: CONFIG.items[item].name.toLowerCase() });
        out.events.push({ type: 'itemTaken', dieId: c.d.id, faceIdx: c.fi, item, previous, becomes: c.d.faces[c.fi],
          by: face.name, enemy: enemy.name, wasCurrent: c.d.idx === c.fi });
      } else {
        ev.text = T.noItem || ev.text;
        ev.nothing = true;
      }
    }
    return out;
  }

  // ---------- win / lose ----------
  // null while some hostile face is unresolved; else 'BEATEN' | 'BEFRIENDED' (ties -> befriended)
  function checkWin(enemy) {
    if (!enemy.faces.every(f => !isHostile(f) || isResolved(f))) return null;
    let broken = 0, turned = 0;
    enemy.faces.forEach(f => {
      if (!isHostile(f)) return;                       // majority of *resolved hostile* faces
      const s = faceStatus(f);
      if (s === 'broken') broken++; else if (s === 'turned') turned++;
    });
    return broken > turned ? CONFIG.text.beaten : CONFIG.text.befriended;
  }
  function checkLose(player) { return countScars(player) >= CONFIG.maxScars; }

  // ---------- trip & encounter ----------
  // trip = { dice, player:{dice} (same array, so encounters/countScars work), inventory:[itemId], discarded:[itemId],
  //          log:[], sequence:[ids], stageIdx, stage, encounter, results:[{enemyId,result,turns}], placement, over, result }
  // createTrip(rng) = M1 sequence; createTrip(rng, ['DOG', ...]) = custom sequence; createTrip(rng, 'm2') = M2 map trip.
  // M2 trip adds { mode:'m2', map, daylight, moves, coldHits, site } and uses stage 'MAP' | 'SITE' | enemyId | 'CAMPFIRE'.
  // M1 sequence: m1Events distinct random events from m1Pool, the campfire after event campfireAfter.
  function randomSequence(rng) {
    const pool = CONFIG.trip.m1Pool.slice(), picks = [];
    for (let k = 0; k < CONFIG.trip.m1Events && pool.length; k++) picks.push(pool.splice(randInt(rng, pool.length), 1)[0]);
    const seq = picks.slice(0, CONFIG.trip.campfireAfter);
    seq.push(CONFIG.trip.campfireId);
    return seq.concat(picks.slice(CONFIG.trip.campfireAfter));
  }
  function createTrip(rng, sequence) {
    const dice = makeDice();
    const m2 = sequence === 'm2';
    const seq = m2 ? [] : (sequence || randomSequence(rng)).slice();
    const trip = { dice, player: { dice }, inventory: CONFIG.startingInventory.slice(), discarded: [], log: [], sequence: seq, stageIdx: 0, stage: seq[0] || null,
      encounter: null, results: [], placement: null, over: null, result: null, mode: m2 ? 'm2' : 'm1' };
    if (m2) {
      trip.map = generateMap(rng);
      trip.daylight = CONFIG.map.daylight; trip.moves = 0; trip.coldHits = 0; trip.site = null;
      trip.stage = CONFIG.trip.mapStage;
    }
    return trip;
  }
  const createTripM2 = (rng) => createTrip(rng, 'm2');
  const tripScars = (trip) => countScars(trip.player);
  // encounter = { enemyId, enemy, player (shared with the trip), turn, rerolls, rerollPenalty, rerollBonus, pendingSow,
  //               taken:[itemId], over:null|'won'|'lost', result, log:[] }  (+ hidden non-enumerable `trip`)
  function startEncounter(trip, enemyId, rng) {
    trip.player.dice.forEach(d => { d.frozen = false; });
    const enc = { enemyId, enemy: createEnemy(enemyId, rng), player: trip.player, turn: 1, rerolls: 0, rerollPenalty: 0,
      rerollBonus: 0, pendingSow: 0, tax: 0, taken: [], over: null, result: null, resultLabel: null, log: [] };
    Object.defineProperty(enc, 'trip', { value: trip, enumerable: false, writable: true });
    trip.encounter = enc;
    return enc;
  }
  // Single-fight convenience (v0 API): a fresh trip with the first encounter started.
  function createGame(rng) { return startEncounter(createTrip(rng, [CONFIG.trip.singleFight]), CONFIG.trip.singleFight, rng); }

  function clearTurnStatus(state) { state.tax = 0; state.player.dice.forEach(d => { d.frozen = false; }); }
  // result codes stay BEATEN / BEFRIENDED; the label shown to the player comes from the enemy data
  const labelFor = (enemy, result) => (enemy && enemy.resultLabels
    ? (result === CONFIG.text.beaten ? enemy.resultLabels.beaten : enemy.resultLabels.befriended) : result);
  function endWon(state, result) {
    state.over = 'won'; state.result = result;
    state.resultLabel = labelFor(state.enemy, result);
    clearTurnStatus(state);
    const trip = state.trip;
    if (trip) trip.results.push({ enemyId: state.enemyId, result, label: state.resultLabel, turns: state.turn });
  }
  function logLine(state, line) { state.log.push(line); if (state.trip) state.trip.log.push(line); }

  // Begin a turn: applies a pending WATERING CAN SOW first (may win the encounter), then clears holds, rolls all
  // dice, sets rerolls = base - GROWL-type penalty + SEED POUCH bonus (min 0).
  // -> { rerolls, events, over, result }  (if over === 'won' the dice were not rolled)
  function startTurn(state, rng) {
    const events = [];
    if (state.pendingSow > 0) {
      const amount = state.pendingSow;
      state.pendingSow = 0;
      events.push({ type: 'pendingSow', phase: 'applied', amount });
      const broke = [];
      applyVerb(state.enemy, 'SOW', amount).forEach(e => {
        events.push(e);
        if (e.type === 'faceResolved') broke.push((e.resolved === 'broken' ? 'broke ' : 'turned ') + state.enemy.faces[e.faceIdx].name);
      });
      const win = checkWin(state.enemy);
      let line = 'T' + state.turn + ': watering can: SOW ' + amount + (broke.length ? ', ' + broke.join(', ') : '');
      if (win) {
        endWon(state, win);
        events.push({ type: 'win', result: win });
        logLine(state, line + '; ' + win);
        return { rerolls: 0, events, over: state.over, result: state.result };
      }
      logLine(state, line);
    }
    state.rerolls = Math.max(0, CONFIG.rerollsPerTurn - state.rerollPenalty + state.rerollBonus);
    state.rerollPenalty = 0;
    state.rerollBonus = 0;
    state.player.dice.forEach(d => { d.held = false; rollDie(d, rng); });
    return { rerolls: state.rerolls, events, over: null, result: null };
  }

  // slotOrder: 3 die ids (or indices into player.dice) in slot order.
  function resolveTurn(state, slotOrder, rng) {
    const events = [];
    const dice = slotOrder.map(s => typeof s === 'number' ? state.player.dice[s] : state.player.dice.find(d => d.id === s));
    if (dice.length !== state.player.dice.length || dice.some(d => !d) || new Set(dice).size !== dice.length)
      throw new Error('slotOrder must place every die exactly once');
    const faces = dice.map(currentFace);
    const enemy = state.enemy;
    const tax = state.tax || 0;
    state.tax = 0;                                        // a tax lasts for exactly this sentence
    state.player.dice.forEach(d => { d.frozen = false; });   // so does a frozen die
    const evaluation = evaluateSentence(faces, { enemy, tax });
    const sentenceStr = faces.map((f, i) => i === evaluation.mindIndex ? '[' + f + ']' : f).join(' ');
    const broke = [];
    let turnedCount = 0;

    events.push({ type: 'sentence', slotOrder: dice.map(d => d.id), faces, evaluation, text: evaluation.text });
    evaluation.steps.forEach((step, index) => events.push({ type: 'step', index, step }));
    // PLUNGER (DIG): turns pips on the current intent face before the damage verbs are spent
    if (evaluation.plungerPips > 0 && enemy.current) {
      const fi = enemy.current.faceIdx, face = enemy.faces[fi];
      for (let k = 0; k < evaluation.plungerPips; k++) {
        const pi = face.pips.indexOf('intact');
        if (pi < 0) break;
        face.pips[pi] = CONFIG.pipResult.SOW;
        events.push({ type: 'pip', faceIdx: fi, pipIdx: pi, to: CONFIG.pipResult.SOW, verb: 'DIG', plunger: true });
        if (isResolved(face)) {
          events.push({ type: 'faceResolved', faceIdx: fi, resolved: faceStatus(face) });
          if (faceStatus(face) === 'turned') turnedCount++;
          broke.push((faceStatus(face) === 'broken' ? 'broke ' : 'turned ') + face.name);
        }
      }
    }
    evaluation.order.forEach(v => {
      const m = evaluation.mods[v];
      if (m) events.push({ type: 'mod', verb: v, mod: m.mod, before: m.before, after: m.after, source: m.source });
      const tx = evaluation.taxed[v];
      if (tx) events.push({ type: 'taxed', verb: v, amount: tx.amount, before: tx.before, after: tx.after });
      const amount = evaluation.totals[v];
      if (amount <= 0) return;
      const alt = v === 'PRUNE' ? evaluation.shears : 0;
      events.push({ type: 'verb', verb: v, amount, shears: alt });
      applyVerb(enemy, v, amount, { alternate: alt }).forEach(e => {
        events.push(e);
        if (e.type === 'faceResolved') {
          if (e.resolved === 'turned') turnedCount++;
          broke.push((e.resolved === 'broken' ? 'broke ' : 'turned ') + enemy.faces[e.faceIdx].name);
        }
      });
    });

    // foresight / reveal: DIG with depth d makes sure d intents are pre-rolled and visible
    const changed = refreshUpcoming(enemy, rng);
    const depth = evaluation.revealDepth;
    if (depth > 0) {
      ensureUpcoming(enemy, depth, rng);
      enemy.foresight = Math.max(enemy.foresight, depth);
      enemy.shown = Math.max(enemy.shown, depth);
    }
    syncNext(enemy);
    const win = checkWin(enemy);
    if ((depth > 0 || (changed && enemy.shown > 0)) && enemy.upcoming.length) {
      events.push({ type: 'reveal', next: copyIntent(enemy.upcoming[0]), face: enemy.faces[enemy.upcoming[0].faceIdx].name,
        rerolled: changed && enemy.shown > 0, depth: enemy.shown, list: shownList(enemy) });
    }

    // sentence-triggered effects for the next turn (not when the enemy is already beaten)
    const extras = [];
    if (!win) {
      if (evaluation.pendingSow > 0) {
        state.pendingSow += evaluation.pendingSow;
        events.push({ type: 'pendingSow', phase: 'queued', amount: evaluation.pendingSow, total: state.pendingSow });
        extras.push('watering can: +' + evaluation.pendingSow + ' SOW next turn');
      }
      if (evaluation.seeds && turnedCount > 0) {
        const bonus = turnedCount * RULES.seedPouchRerollPerTurned;
        state.rerollBonus += bonus;
        events.push({ type: 'rerollBonus', amount: bonus, total: state.rerollBonus, source: 'SEED_POUCH' });
        extras.push('seeds: +' + bonus + ' reroll next turn');
      }
    }

    const head = 'T' + state.turn + ': ' + sentenceStr + ' → ' + evaluation.totalsText +
      (broke.length ? ', ' + broke.join(', ') : '') + (extras.length ? ', ' + extras.join(', ') : '');
    const finish = (tail) => {
      const line = head + (tail ? '; ' + tail : '');
      logLine(state, line);
      return { events, log: line, over: state.over, result: state.result, evaluation };
    };

    // win check (before the enemy acts)
    if (win) {
      endWon(state, win);
      events.push({ type: 'win', result: win });
      return finish(win);
    }

    // enemy acts
    const act = enemyAct(state, rng);
    act.events.forEach(e => events.push(e));
    const actEv = act.events[0];
    let tail = enemy.logName + ' ' + actEv.text;
    const scar = act.events.find(e => e.type === 'scar');
    if (scar) tail += ' (' + scar.dieId + ' ' + scar.previous + ' → ' + SCAR + ')';
    const destroyed = act.events.find(e => e.type === 'itemDestroyed');
    if (destroyed && destroyed.cause === 'river') tail += ' (' + destroyed.dieId + ' ' + destroyed.previous + ' → ' + destroyed.becomes + '), ' +
      CONFIG.items[destroyed.item].name + ' lost for good';
    else if (destroyed) tail += ', ' + CONFIG.items[destroyed.item].name + ' destroyed by the ' + destroyed.by.toLowerCase();
    const taken = act.events.find(e => e.type === 'itemTaken');
    if (taken) tail += ' (' + taken.dieId + ' ' + taken.previous + ' → ' + taken.becomes + ')';

    if (checkLose(state.player)) {
      state.over = 'lost'; state.result = CONFIG.text.lost;
      clearTurnStatus(state);
      if (state.trip) { state.trip.over = 'lost'; state.trip.result = CONFIG.text.lost; }
      events.push({ type: 'lose', scars: countScars(state.player) });
      return finish(tail + '; ' + CONFIG.text.lost);
    }

    // next intent: take from the pre-rolled queue
    state.turn += 1;
    refreshUpcoming(enemy, rng);
    let cur = enemy.upcoming.shift();
    if (!cur) cur = rollIntent(enemy, rng);
    enemy.current = cur;
    if (enemy.foresight > 0) {
      ensureUpcoming(enemy, enemy.foresight, rng);
      enemy.shown = enemy.foresight;
      enemy.foresight = 0;
    } else enemy.shown = 0;
    syncNext(enemy);
    events.push({ type: 'newIntent', intent: copyIntent(cur), face: enemy.faces[cur.faceIdx].name,
      next: copyIntent(enemy.next), nextFace: enemy.next ? enemy.faces[enemy.next.faceIdx].name : null,
      list: shownList(enemy) });
    return finish(tail);
  }

  // ---------- rewards & inventory ----------
  // -> { choose: [ids]|null, give: [ids], returned: [ids], revealTiles: n, ending: 'beaten'|'befriended' }
  function rewardsFor(trip, result) {
    const enc = trip.encounter;
    const ending = result === CONFIG.text.beaten ? 'beaten' : 'befriended';
    const r = CONFIG.enemies[enc.enemyId].rewards[ending] || {};
    const out = { ending, choose: r.choose ? r.choose.slice() : null, give: (r.give || []).slice(),
      returned: r.returnTaken ? enc.taken.slice() : [], revealTiles: r.revealTiles || 0 };
    out.empty = !out.choose && !out.give.length && !out.returned.length;   // nothing to get: skip reward + placement
    return out;
  }
  function addToInventory(trip, itemId) {
    if (!CONFIG.items[itemId]) throw new Error('unknown item ' + itemId);
    trip.inventory.push(itemId);
    return trip.inventory.length;
  }
  // Adds give + returned (+ the picked choice) to the inventory. -> { ok, added:[ids], revealed:[{c,r}] (M2), reason? }
  function claimReward(trip, result, pick, rng) {
    const r = rewardsFor(trip, result);
    if (r.choose && r.choose.indexOf(pick) < 0) return { ok: false, added: [], reason: 'pick-required' };
    const added = r.returned.concat(r.give, r.choose ? [pick] : []);
    added.forEach(id => addToInventory(trip, id));
    if (trip.encounter) { trip.encounter.taken = []; }
    // M2: a befriended dog (revealTiles) shows some fogged tiles. rng picks them (without rng: first fogged tiles in map order).
    let revealed = [];
    if (trip.mode === 'm2' && trip.map && r.revealTiles > 0) {
      revealed = revealTiles(trip, r.revealTiles, rng);
      if (revealed.length) {
        const line = CONFIG.enemies[trip.encounter ? trip.encounter.enemyId : CONFIG.trip.singleFight].logName + ' ' +
          CONFIG.map.text.revealed + ': ' + revealed.length + ' tiles';
        trip.log.push(line);
      }
    }
    return { ok: true, added, revealed };
  }

  // ---------- placement ----------
  // modes: 'reward' (existing placements locked; items placed during this screen stay movable) | 'campfire' (free)
  //        | 'intro' (trip start: same rules as campfire; dice are bare, the starting inventory is placed here)
  const faceKey = (dieId, idx) => dieId + ':' + idx;
  function beginPlacement(trip, mode) { trip.placement = { mode: mode || 'reward', fresh: [] }; return trip.placement; }
  function endPlacement(trip) { const p = trip.placement; trip.placement = null; return p; }
  const modeOf = (trip, mode) => mode || (trip.placement && trip.placement.mode) || 'reward';
  function ensurePlacement(trip, mode) {
    if (!trip.placement || trip.placement.mode !== mode) beginPlacement(trip, mode);
    return trip.placement;
  }
  const dieOf = (trip, dieId) => trip.dice.find(d => d.id === dieId);
  // Can `itemId` sit on that face? -> { ok, reason?, replaces: itemId|null }   (does not check the inventory)
  function canPlace(trip, itemId, dieId, faceIdx, mode) {
    const def = CONFIG.items[itemId];
    if (!def) return { ok: false, reason: 'unknown-item', replaces: null };
    const die = dieOf(trip, dieId);
    if (!die || CONFIG.itemDice.indexOf(dieId) < 0) return { ok: false, reason: 'not-an-item-die', replaces: null };
    if (!(faceIdx >= 0 && faceIdx < die.faces.length)) return { ok: false, reason: 'no-face', replaces: null };
    const p = parseFace(die.faces[faceIdx]);
    if (p.kind === 'scar') return { ok: false, reason: 'scar', replaces: null };
    if (p.body !== def.part) return { ok: false, reason: 'wrong-part', replaces: null };
    return { ok: true, reason: null, replaces: p.item };
  }
  function isLocked(trip, dieId, faceIdx, mode) {
    mode = modeOf(trip, mode);
    const die = dieOf(trip, dieId);
    if (!die || !parseFace(die.faces[faceIdx]).item) return false;
    if (mode === 'campfire' || mode === 'intro') return false;       // free modes
    return !(trip.placement && trip.placement.fresh.indexOf(faceKey(dieId, faceIdx)) >= 0);
  }
  // Place an inventory item on a face (replacing + discarding any item already there). -> { ok, replaced, reason? }
  function placeItem(trip, itemId, dieId, faceIdx, mode) {
    mode = modeOf(trip, mode);
    const at = trip.inventory.indexOf(itemId);
    if (at < 0) return { ok: false, replaced: null, reason: 'not-in-inventory' };
    const chk = canPlace(trip, itemId, dieId, faceIdx, mode);
    if (!chk.ok) return { ok: false, replaced: null, reason: chk.reason };
    const pl = ensurePlacement(trip, mode);
    const die = dieOf(trip, dieId);
    trip.inventory.splice(at, 1);
    if (chk.replaces) trip.discarded.push(chk.replaces);
    die.faces[faceIdx] = parseFace(die.faces[faceIdx]).body + '+' + itemId;
    if (pl.fresh.indexOf(faceKey(dieId, faceIdx)) < 0) pl.fresh.push(faceKey(dieId, faceIdx));
    return { ok: true, replaced: chk.replaces, reason: null };
  }
  // Move a placed item to another face (occupied target: replaced + discarded). reward mode: only items placed this screen.
  function moveItem(trip, fromDie, fromIdx, toDie, toIdx, mode) {
    mode = modeOf(trip, mode);
    const src = dieOf(trip, fromDie);
    const sp = src && parseFace(src.faces[fromIdx]);
    if (!sp || !sp.item) return { ok: false, replaced: null, reason: 'no-item' };
    if (isLocked(trip, fromDie, fromIdx, mode)) return { ok: false, replaced: null, reason: 'locked' };
    if (fromDie === toDie && fromIdx === toIdx) return { ok: true, replaced: null, reason: null };
    const chk = canPlace(trip, sp.item, toDie, toIdx, mode);
    if (!chk.ok) return { ok: false, replaced: null, reason: chk.reason };
    const pl = ensurePlacement(trip, mode);
    const dst = dieOf(trip, toDie);
    if (chk.replaces) trip.discarded.push(chk.replaces);
    src.faces[fromIdx] = sp.body;
    dst.faces[toIdx] = parseFace(dst.faces[toIdx]).body + '+' + sp.item;
    const fi = pl.fresh.indexOf(faceKey(fromDie, fromIdx));
    if (fi >= 0) pl.fresh.splice(fi, 1);
    if (pl.fresh.indexOf(faceKey(toDie, toIdx)) < 0) pl.fresh.push(faceKey(toDie, toIdx));
    return { ok: true, replaced: chk.replaces, reason: null };
  }
  // Take a placed item off its face and back to the inventory. reward mode: only items placed this screen.
  function unplaceItem(trip, dieId, faceIdx, mode) {
    mode = modeOf(trip, mode);
    const die = dieOf(trip, dieId);
    const p = die && parseFace(die.faces[faceIdx]);
    if (!p || !p.item) return { ok: false, item: null, reason: 'no-item' };
    if (isLocked(trip, dieId, faceIdx, mode)) return { ok: false, item: null, reason: 'locked' };
    die.faces[faceIdx] = p.body;
    trip.inventory.push(p.item);
    const pl = trip.placement;
    if (pl) { const fi = pl.fresh.indexOf(faceKey(dieId, faceIdx)); if (fi >= 0) pl.fresh.splice(fi, 1); }
    return { ok: true, item: p.item, reason: null };
  }
  // Campfire: a SCAR face returns as the bare body part it started as (its item is not restored).
  function healScar(trip, dieId, faceIdx) {
    const die = dieOf(trip, dieId);
    if (!die || die.faces[faceIdx] !== SCAR) return { ok: false, restored: null, reason: 'not-a-scar' };
    const orig = CONFIG.playerDice.find(d => d.id === dieId).faces[faceIdx];
    const part = parseFace(orig).body;
    die.faces[faceIdx] = part;
    const line = 'campfire: healed ' + dieId + ' face ' + (faceIdx + 1) + ' → ' + part;
    trip.log.push(line);
    return { ok: true, restored: part, reason: null };
  }

  // Odds summary for a die ({id, faces}). -> { text, parts:{PART:{count,items:{ID:n}}}, bare, scar, itemFaces, total }
  function oddsSummary(die) {
    const orig = CONFIG.playerDice.find(d => d.id === die.id);
    const total = die.faces.length;
    const parts = {}, partOrder = [];
    let scar = 0, bare = 0, itemFaces = 0;
    die.faces.forEach((f, i) => {
      const p = parseFace(f);
      if (p.kind === 'scar') { scar++; return; }
      const part = p.body;
      if (!parts[part]) { parts[part] = { count: 0, items: {} }; partOrder.push(part); }
      parts[part].count++;
      if (p.item) { parts[part].items[p.item] = (parts[part].items[p.item] || 0) + 1; itemFaces++; } else bare++;
    });
    // part order and the set of parts follow the die's original layout
    const origParts = [];
    (orig ? orig.faces : []).forEach(f => { const b = parseFace(f).body; if (b && origParts.indexOf(b) < 0) origParts.push(b); });
    const names = origParts.length ? origParts : partOrder;
    names.forEach(n => { if (!parts[n]) parts[n] = { count: 0, items: {} }; });
    const itemStr = (items) => Object.keys(items).map(id => items[id] + '× ' + CONFIG.items[id].name);
    let text;
    if (names.length <= 1) {
      const n = names[0] || '';
      const items = parts[n] ? itemStr(parts[n].items) : [];
      text = fmt(CONFIG.odds.single, { part: n, items: items.length ? items.join(' · ') + ' · ' : '', bare, scar, k: itemFaces, n: total });
    } else {
      const pieces = names.map(n => {
        const items = itemStr(parts[n].items);
        return fmt(CONFIG.odds.partPiece, { part: n, count: parts[n].count, items: items.length ? items.join(' · ') : CONFIG.odds.noItems });
      });
      text = fmt(CONFIG.odds.multiPart, { parts: pieces.join(' · '), scar, n: total });
    }
    return { text, parts, bare, scar, itemFaces, total };
  }

  // ---------- M2: map ----------
  // trip.map = { cols, rows, tiles[row][col], start:{c,r}, gate:{c,r}, pos:{c,r} }
  // tile = { c, r, type:'START'|'GATE'|'CHARACTER'|'SCAVENGE'|'CAMPFIRE'|'EMPTY', origin, enemyId|null, siteId|null, visited, revealed }
  const MAPCFG = CONFIG.map;
  const SR = CONFIG.siteRules;
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];             // up, right, down, left
  const tileAt = (map, c, r) => (r >= 0 && r < map.rows && c >= 0 && c < map.cols ? map.tiles[r][c] : null);
  function weightedPick(rng, weights) {
    const keys = Object.keys(weights);
    let sum = 0; keys.forEach(k => { sum += weights[k]; });
    let x = rng() * sum;
    for (const k of keys) { x -= weights[k]; if (x < 0) return k; }
    return keys[keys.length - 1];
  }
  function neighbours(map, c, r) {
    const out = [];
    DIRS.forEach(d => { const t = tileAt(map, c + d[0], r + d[1]); if (t) out.push(t); });
    return out;
  }
  // Is there a walkable path (all tiles are walkable) from START to GATE? BFS, used by tests.
  function mapHasPath(map) {
    const seen = new Set([map.start.c + ',' + map.start.r]);
    const q = [map.start];
    while (q.length) {
      const p = q.shift();
      if (p.c === map.gate.c && p.r === map.gate.r) return true;
      neighbours(map, p.c, p.r).forEach(t => {
        const k = t.c + ',' + t.r;
        if (!seen.has(k)) { seen.add(k); q.push(t); }
      });
    }
    return false;
  }
  function generateMap(rng) {
    const cols = MAPCFG.cols, rows = MAPCFG.rows;
    const sr = MAPCFG.startRow != null ? MAPCFG.startRow : Math.floor((rows - 1) / 2);
    const gr = randInt(rng, rows);
    const enemyIds = CONFIG.trip.enemyPool, siteIds = Object.keys(CONFIG.sites);
    const tiles = [];
    const detail = (t) => {
      t.enemyId = t.type === 'CHARACTER' ? enemyIds[randInt(rng, enemyIds.length)] : null;
      t.siteId = t.type === 'SCAVENGE' ? siteIds[randInt(rng, siteIds.length)] : null;
    };
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        let type;
        if (c === 0 && r === sr) type = 'START';
        else if (c === cols - 1 && r === gr) type = 'GATE';
        else type = weightedPick(rng, MAPCFG.weights);
        const t = { c, r, type, origin: type, enemyId: null, siteId: null, visited: false, revealed: false };
        detail(t);
        row.push(t);
      }
      tiles.push(row);
    }
    // guarantee a campfire in the campfire columns
    const [c0, c1] = MAPCFG.campfireCols;
    const band = [];
    let hasFire = false;
    for (let r = 0; r < rows; r++) for (let c = c0; c <= c1 && c < cols; c++) {
      const t = tiles[r][c];
      if (t.type === 'CAMPFIRE') hasFire = true;
      else if (t.type !== 'START' && t.type !== 'GATE') band.push(t);
    }
    if (!hasFire && band.length) {
      const t = band[randInt(rng, band.length)];
      t.type = t.origin = 'CAMPFIRE'; t.enemyId = null; t.siteId = null;
    }
    const map = { cols, rows, tiles, start: { c: 0, r: sr }, gate: { c: cols - 1, r: gr }, pos: { c: 0, r: sr } };
    tiles[sr][0].visited = true;
    return map;
  }
  // Tile specific word (DOG, HEAP, FIRE, ...), ignoring fog.
  function tileWord(t) {
    if (t.type === 'CHARACTER') return MAPCFG.enemyWords[t.enemyId] || t.enemyId;
    if (t.type === 'SCAVENGE') return CONFIG.sites[t.siteId].word;
    return MAPCFG.words[t.type] || t.type;
  }
  // Visible = visited, revealed (dog), orthogonally adjacent to a visited tile, (optionally) the gate.
  function isVisible(map, t) {
    if (t.visited || t.revealed) return true;
    if (MAPCFG.gateVisible && t.type === 'GATE') return true;
    return neighbours(map, t.c, t.r).some(n => n.visited);
  }
  // Render model: rows of cells. Fogged cells have type/word = null / FOG word and no enemyId/siteId.
  function mapView(trip) {
    const map = trip.map;
    const moves = legalMoves(trip);
    return map.tiles.map(row => row.map(t => {
      const vis = isVisible(map, t);
      return { c: t.c, r: t.r, visible: vis, visited: t.visited, revealed: t.revealed, here: map.pos.c === t.c && map.pos.r === t.r,
        reachable: moves.some(m => m.c === t.c && m.r === t.r),
        type: vis ? t.type : null, word: vis ? tileWord(t) : MAPCFG.words.FOG,
        enemyId: vis ? t.enemyId : null, siteId: vis ? t.siteId : null };
    }));
  }
  function legalMoves(trip) {
    if (!trip.map || trip.over || trip.stage !== CONFIG.trip.mapStage) return [];
    const p = trip.map.pos;
    return neighbours(trip.map, p.c, p.r).map(t => ({ c: t.c, r: t.r }));
  }
  // Reveal n random fogged tiles (dog befriended). -> [{c,r}]
  function revealTiles(trip, n, rng) {
    const map = trip.map;
    const fog = [];
    map.tiles.forEach(row => row.forEach(t => { if (!isVisible(map, t)) fog.push(t); }));
    const out = [];
    while (n > 0 && fog.length) {
      const t = fog.splice(rng ? randInt(rng, fog.length) : 0, 1)[0];
      t.revealed = true; out.push({ c: t.c, r: t.r }); n--;
    }
    return out;
  }
  // A random non-scar face on the biteTargets dice becomes SCAR (its item is destroyed). -> events (empty if no face is left)
  function inflictScar(trip, rng, cause, by) {
    const cands = [];
    trip.player.dice.forEach(d => {
      if (CONFIG.biteTargets.indexOf(d.id) < 0) return;
      d.faces.forEach((f, fi) => { if (f !== SCAR && !isSturdy(f)) cands.push({ d, fi }); });
    });
    if (!cands.length) return [];
    const c = cands[randInt(rng, cands.length)];
    const previous = c.d.faces[c.fi];
    c.d.faces[c.fi] = SCAR;
    const events = [{ type: 'scar', dieId: c.d.id, faceIdx: c.fi, previous, wasCurrent: c.d.idx === c.fi, cause }];
    const item = parseFace(previous).item;
    if (item) events.push({ type: 'itemDestroyed', dieId: c.d.id, faceIdx: c.fi, item, cause, by: by || cause, wasCurrent: c.d.idx === c.fi });
    return events;
  }
  function scarLogText(events, by) {
    const sc = events.find(e => e.type === 'scar');
    if (!sc) return '';
    let t = ' (' + sc.dieId + ' ' + sc.previous + ' → ' + SCAR + ')';
    const it = events.find(e => e.type === 'itemDestroyed');
    if (it) t += ', ' + CONFIG.items[it.item].name + ' destroyed by ' + by;
    return t;
  }
  // Trip lost when scars reach the maximum. -> true if the trip was just lost
  function tripLoseCheck(trip, events, cause) {
    if (!checkLose(trip.player)) return false;
    trip.over = 'lost'; trip.result = CONFIG.text.lost;
    events.push({ type: 'lose', scars: countScars(trip.player), cause });
    return true;
  }
  // Move one tile orthogonally. Costs daylight (at 0: the cold scars you), then triggers the tile.
  // -> { ok, reason, events, entered:{tile,enemyId?,siteId?}|null, over, result, encounter, site }
  function moveTo(trip, c, r, rng) {
    const out = { ok: false, reason: null, events: [], entered: null, over: trip.over, result: trip.result, encounter: null, site: null };
    if (!trip.map) { out.reason = 'no-map'; return out; }
    if (trip.over) { out.reason = 'over'; return out; }
    if (trip.stage !== CONFIG.trip.mapStage) { out.reason = 'not-on-map'; return out; }
    const map = trip.map, from = { c: map.pos.c, r: map.pos.r };
    const t = tileAt(map, c, r);
    if (!t) { out.reason = 'out-of-bounds'; return out; }
    if (Math.abs(c - from.c) + Math.abs(r - from.r) !== 1) { out.reason = 'not-adjacent'; return out; }
    out.ok = true;
    const ev = out.events;
    map.pos = { c, r };
    t.visited = true;
    trip.moves += 1;
    let cold = false;
    if (trip.daylight > 0) trip.daylight = Math.max(0, trip.daylight - MAPCFG.daylightPerMove);
    else cold = true;
    ev.push({ type: 'move', from, to: { c, r }, daylight: trip.daylight, moves: trip.moves, cold });
    trip.log.push('move ' + trip.moves + ': (' + from.c + ',' + from.r + ') → (' + c + ',' + r + '), daylight ' + trip.daylight);
    if (cold) {
      trip.coldHits += 1;
      ev.push({ type: 'cold', daylight: 0, coldHits: trip.coldHits, text: MAPCFG.text.cold });
      for (let k = 0; k < MAPCFG.coldScarsPerMove; k++) {
        const se = inflictScar(trip, rng, 'cold', MAPCFG.text.cold.toLowerCase());
        se.forEach(e => ev.push(e));
        trip.log.push(MAPCFG.text.coldLog + scarLogText(se, 'the cold'));
        if (tripLoseCheck(trip, ev, 'cold')) {
          trip.log.push(CONFIG.text.lost);
          trip.stage = null;
          out.over = trip.over; out.result = trip.result;
          return out;
        }
      }
    }
    // enter the tile
    const entered = { tile: t.type, enemyId: t.enemyId, siteId: t.siteId };
    out.entered = entered;
    ev.push({ type: 'enter', tile: t.type, enemyId: t.enemyId, siteId: t.siteId, c, r });
    if (t.type === 'CHARACTER') {
      trip.stage = t.enemyId;
      out.encounter = startEncounter(trip, t.enemyId, rng);
    } else if (t.type === 'SCAVENGE') {
      out.site = startSite(trip, t.siteId, rng, { c, r });
    } else if (t.type === 'CAMPFIRE') {
      trip.stage = CONFIG.trip.campfireId;
    } else if (t.type === 'GATE') {
      trip.over = 'won'; trip.result = CONFIG.text.tripComplete; trip.stage = null;
      ev.push({ type: 'tripWon', result: trip.result, daylight: trip.daylight });
      trip.log.push('the gate: ' + trip.result);
    }
    out.over = trip.over; out.result = trip.result;
    return out;
  }
  // The tile the player stands on is resolved: it becomes EMPTY; back to the map. (Called by advanceStage in M2.)
  function finishTile(trip) {
    const t = trip.map && tileAt(trip.map, trip.map.pos.c, trip.map.pos.r);
    if (t && (t.type === 'CHARACTER' || t.type === 'SCAVENGE' || t.type === 'CAMPFIRE')) {
      t.type = 'EMPTY'; t.enemyId = null; t.siteId = null;
    }
    trip.site = null; trip.encounter = null; trip.placement = null;
    trip.stage = trip.over ? null : CONFIG.trip.mapStage;
    return trip.stage;
  }

  // ---------- M2: scavenge sites ----------
  // site = { siteId, name, word, at:{c,r}|null, faces:[{content, item, pips, pipsLeft, revealed, opened, brokenItem}], noise, noiseMax,
  //          turn, rerolls, rerollPenalty, rerollBonus, pendingSow, player, target:idx|null, gained:[itemId], guardian:enemyId,
  //          over:null|'left'|'guardian'|'lost', log:[] }  (+ hidden non-enumerable `trip`; works with startTurn / rerollUnheld)
  function createSite(trip, siteId, rng, at) {
    const c = CONFIG.sites[siteId];
    if (!c) throw new Error('unknown site ' + siteId);
    const contents = c.faces.slice();
    if (SR.shuffleFaces) for (let i = contents.length - 1; i > 0; i--) {
      const j = randInt(rng, i + 1);
      const tmp = contents[i]; contents[i] = contents[j]; contents[j] = tmp;
    }
    const faces = contents.map(content => ({ content, item: content === 'ITEM' ? c.pool[randInt(rng, c.pool.length)] : null,
      pips: c.pips, pipsLeft: c.pips, revealed: false, opened: false, brokenItem: null }));
    const site = { siteId, name: c.name, word: c.word, at: at || null, faces, noise: 0, noiseMax: CONFIG.noiseMax,
      turn: 1, rerolls: 0, rerollPenalty: 0, rerollBonus: 0, pendingSow: 0, player: trip.player, target: null,
      gained: [], guardian: c.guardian, over: null, log: [] };
    Object.defineProperty(site, 'trip', { value: trip, enumerable: false, writable: true });
    return site;
  }
  // Enter a site (from the map, or debug jump). Sets trip.site and trip.stage.
  function startSite(trip, siteId, rng, at) {
    const site = createSite(trip, siteId, rng, at);
    trip.site = site;
    if (trip.mode === 'm2') trip.stage = CONFIG.trip.siteStage;   // M1: the stage stays the site id (the sequence entry)
    const l = 'arrived at ' + site.name;
    site.log.push(l); trip.log.push(l);
    return site;
  }
  const unopenedIdx = (site) => site.faces.map((f, i) => (f.opened ? -1 : i)).filter(i => i >= 0);
  // First unopened face at or after `from` (wrapping). -1 if none.
  function nextUnopened(site, from) {
