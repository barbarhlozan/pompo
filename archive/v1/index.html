    [['bg', K.bg], ['panel', K.panel], ['line', K.line], ['text', K.text], ['dim', K.textDim], ['lit', K.lit], ['status', K.status],
     ['danger', K.scarText], ['glow', K.glow], ['pip', K.pipIntact], ['broken', K.broken], ['turned', K.turned], ['tiletext', K.tileText],
     ['lift', C.fx.liftScale]].forEach(kv => { if (kv[1] != null) root.setProperty('--' + kv[0], kv[1]); });
    $('titleLabel').textContent = C.text.title;
    $('btnRoll').textContent = C.text.buttons.roll;
    $('btnCommit').textContent = C.text.buttons.commit;
    $('btnRestart').textContent = C.text.buttons.restart;
    $('ovRestart').textContent = C.text.buttons.continue;
    $('btnRoll').addEventListener('click', onRoll);
    $('btnReroll').addEventListener('click', onReroll);
    $('btnCommit').addEventListener('click', onCommit);
    $('btnRestart').addEventListener('click', onRestart);
    $('btnLeave').addEventListener('click', leaveSiteUI);
    $('btnLeave').textContent = C.text.s.leave;
    $('btnLeave').title = C.text.m2.leaveTip;
    $('faceStrip').addEventListener('click', onSiteCardClick);
    $('ovRestart').addEventListener('click', onContinue);
    $('screen').addEventListener('click', onScreenClick);
    $('screen').addEventListener('pointerdown', onPlacePointerDown);
    $('screen').addEventListener('pointerover', onScreenOver);
    $('screen').addEventListener('pointerout', onScreenOut);
    window.addEventListener('keydown', onKey);
  }

  // Rebuilds the per-encounter enemy panel: label, tags / mods, bag, 6 face cards with a variable pip count.
  function buildEnemyPanel() {
    const en = ui.game.enemy, cfg = C.enemies[ui.game.enemyId];
    $('enemyLbl').textContent = en.name + ' · ' + C.text.intentLabel;
    const chips = en.tags.map(t => '<span class="chip">' + esc(t) + '</span>');
    const mods = [['PRUNE', en.pruneMod], ['SOW', en.sowMod]].filter(m => m[1] !== 0)
      .map(m => '<span class="vb" style="color:' + C.colors.verb[m[0]] + '" title="' + esc(C.verbInfo[m[0]] + ' This enemy: ' + signed(m[1]) + ' to your ' + m[0] + ' total.') + '">' + m[0] + ' ' + signed(m[1]) + '</span>');
    $('enemyMeta').innerHTML = chips.join('') + (mods.length ? mods.join(' · ') : '<span>' + C.text.noMods + '</span>');
    const takes = cfg.faces.some(f => f.effect === 'takeItem');
    $('bag').classList.toggle('hidden', !takes);
    ui.bagLabel = (C.text.bagLabel && C.text.bagLabel[ui.game.enemyId]) || 'BAG';
    const strip = $('faceStrip');
    strip.innerHTML = '';
    dom.efc.length = 0;
    cfg.faces.forEach((cf) => {
      const el = document.createElement('div');
      el.className = 'efc';
      el.innerHTML = '<div class="tag"></div><span class="tile"></span><div class="pips"></div>';
      const pips = el.querySelector('.pips');
      for (let p = 0; p < cf.pips; p++) { const sp = document.createElement('span'); sp.className = 'pip'; pips.appendChild(sp); }
      strip.appendChild(el); dom.efc.push(el);
    });
  }

  // Scavenge site: the same panel slots as an enemy (label, meta, noise track instead of the intent tile, 6 face cards).
  function buildSitePanel() {
    const site = ui.game, cfg = C.sites[site.siteId], M = MT();
    $('enemyLbl').textContent = site.name + ' · ' + M.siteLabel;
    const gd = C.enemies[site.guardian];
    $('enemyMeta').innerHTML = '<span class="chip">' + esc(M.guardian) + ': ' + esc(gd.name) + '</span><span>' + esc(M.rulesLine) + '</span>';
    $('bag').classList.add('hidden');
    $('noiseTrack').innerHTML = Array.from({ length: site.noiseMax }, () => '<span class="nb"></span>').join('');
    const strip = $('faceStrip');
    strip.innerHTML = '';
    dom.efc.length = 0;
    site.faces.forEach((f, i) => {
      const el = document.createElement('div');
      el.className = 'efc site'; el.dataset.idx = i;
      el.innerHTML = '<div class="tag"></div><span class="tile"></span><div class="pips"></div><div class="sub"></div><span class="sfn">' + (i + 1) + '</span>';
      const pips = el.querySelector('.pips');
      for (let p = 0; p < f.pips; p++) { const sp = document.createElement('span'); sp.className = 'pip'; pips.appendChild(sp); }
      strip.appendChild(el); dom.efc.push(el);
    });
    void cfg;
  }
  // first unopened face of the (lagging) view; the explicit target wins
  function viewTarget() {
    const sv = view.site;
    if (sv.target !== null && sv.faces[sv.target] && !sv.faces[sv.target].opened) return sv.target;
    return sv.faces.findIndex(f => !f.opened);
  }
  function renderSite() {
    const sv = view.site, M = MT(), SC = C.colors.site;
    const tgt = viewTarget();
    sv.faces.forEach((f, i) => {
      const el = dom.efc[i], tile = el.querySelector('.tile'), sub = el.querySelector('.sub');
      const known = f.opened || f.revealed;
      const ghost = !known && ui.showSite;
      let word, bg, cls = '', note = '';
      if (known || ghost) {
        if (f.content === 'ITEM' && f.item) { word = itemName(f.item); bg = C.colors.item[f.item] || SC.ITEM; }
        else { word = C.siteContents[f.content].label; bg = SC[f.content]; }
        if (f.opened && f.brokenItem) { word = itemName(f.brokenItem); bg = C.colors.item[f.brokenItem] || SC.ITEM; cls = ' strike'; note = M.brokeInto.replace('{item}', itemName(f.brokenItem)); }
        else if (f.opened) note = f.content === 'ITEM' ? M.got : '';
        else if (ghost) { cls = ' ghost'; note = ''; }
        else note = M.seen;
      } else { word = '?'; bg = SC.hidden; }
      tile.className = 'tile' + cls;
      tile.style.background = bg; tile.style.color = (known || ghost) && f.content !== 'NOTHING' ? C.colors.tileText : '#aaa';
      tile.textContent = word;
      sub.textContent = note;
      el.querySelectorAll('.pip').forEach((p, k) => { p.className = 'pip ' + f.pips[k]; });
      el.classList.toggle('opened', f.opened);
      const isCur = !f.opened && tgt === i && sv.target === i;
      el.classList.toggle('is-current', isCur);
      el.classList.toggle('is-next', !f.opened && tgt === i && sv.target !== i);
      el.dataset.status = f.opened ? 'opened' : 'closed';
      el.querySelector('.tag').textContent = f.opened ? '' : (tgt === i ? (sv.target === i ? M.target : M.first) : '');
      el.title = f.opened ? '' : M.targetTip + (known ? '' : ' ' + M.hiddenTip);
    });
    $('noiseTrack').querySelectorAll('.nb').forEach((b, i) => {
      b.classList.toggle('on', i < sv.noise);
      b.classList.toggle('hot', i < sv.noise && sv.noise >= ui.game.noiseMax - 2);
    });
    $('intentText').textContent = M.noise + ' ' + sv.noise + '/' + ui.game.noiseMax;
    $('enemyText').textContent = ui.enemyText || (nothingLeft() ? M.nothingLeft : ' ');
    const nw = $('nextWrap');
    if (sv.found.length) {
      nw.innerHTML = '<span class="lbl">' + M.found + '</span>' + sv.found.map(id => itemTileHTML(id, 'small')).join('');
      nw.classList.remove('hidden'); nw.querySelectorAll('.tile').forEach(t => { t.style.opacity = 1; });
    } else { nw.classList.add('hidden'); nw.innerHTML = ''; }
    $('verbFlash').textContent = ui.verbFlash || '';
  }
  const nothingLeft = () => isSite() && ui.game.faces.every(f => f.opened);
  function onSiteCardClick(e) {
    if (!isSite() || ui.screen !== 'encounter') return;
    if (ui.phase !== 'await-roll' && ui.phase !== 'arranging') return;
    const el = e.target.closest('.efc.site'); if (!el) return;
    const idx = Number(el.dataset.idx), site = ui.game;
    if (site.faces[idx].opened) return;
    const r = E.setSiteTarget(site, site.target === idx ? null : idx);
    if (!r.ok) return;
    view.site.target = site.target;
    renderSite(); renderPreview();
    hooks.onTarget(dom.efc[idx], site.target === idx);
  }
  function leaveSiteUI() {
    if (!isSite() || ui.screen !== 'encounter') return;
    if (ui.phase !== 'await-roll' && ui.phase !== 'arranging') return;
    const t = ui.trip, r = E.leaveSite(t);
    if (!r.ok) return;
    ui.runId++;
    if (r.placement) openPlacement('reward');
    else { advance(); enterStage(); }
  }

  // ---------- render functions (hook points for Phase 3) ----------
  function renderAll() {
    renderTopBar();
    renderScreen();
    $('stage').classList.toggle('site', ui.screen === 'encounter' && isSite());
    if (ui.screen === 'encounter') { renderEnemy(); renderDice(); renderSlots(); renderPreview(); renderControls(); }
    renderOverlay();
  }

  function enemyTileClass(name, status) {
    const col = (C.colors.enemy && C.colors.enemy[name]) || C.colors.hostile;
    if (status === 'broken') return { bg: C.colors.broken, fg: C.colors.tileText, cls: 'broken' };
    if (status === 'turned') return { bg: C.colors.turned, fg: C.colors.tileText, cls: '' };
    return { bg: col, fg: C.colors.tileText, cls: '' };
  }
  function paintEnemyTile(el, name, status, small) {
    const c = enemyTileClass(name, status);
    el.className = 'tile ' + c.cls + (small ? ' small' : '');
    el.style.background = c.bg; el.style.color = c.fg;
    el.textContent = name;
  }
  function intentLine(intent) {
    const f = view.enemy.faces[intent.faceIdx];
    const T = ui.game.enemy.text;
    if (intent.wag) return T.wag;
    if (E.isResolved(f)) return T.broken;
    return (T[f.name] || '').replace('{item}', C.text.itemWord);
  }
  function renderEnemy() {
    if (isSite()) { renderSite(); return; }
    const en = view.enemy;
    en.faces.forEach((f, i) => {
      const el = dom.efc[i], st = E.faceStatus(f);
      paintEnemyTile(el.querySelector('.tile'), f.name, !ui.hidePips && (st === 'broken' || st === 'turned') ? st : 'intact', false);
      el.querySelectorAll('.pip').forEach((p, k) => { p.className = ui.hidePips ? 'pip unknown' : 'pip ' + f.pips[k]; });
      el.classList.toggle('is-current', !!en.current && en.current.faceIdx === i);
      const qi = en.queue.findIndex(q => q.faceIdx === i);
      const isCur = !!en.current && en.current.faceIdx === i;
      el.classList.toggle('is-next', !isCur && qi === 0);
      el.classList.toggle('is-then', !isCur && qi >= 1);
      el.dataset.status = st;
      el.querySelector('.tag').textContent = isCur ? C.text.now : (qi === 0 ? C.text.next : (qi >= 1 ? C.text.then : ''));
    });
    // intent
    const cur = en.current;
    const curFace = en.faces[cur.faceIdx];
    const st = E.faceStatus(curFace);
    paintEnemyTile($('intentTile'), curFace.name, cur.wag ? 'turned' : (st === 'broken' || st === 'turned' ? st : 'intact'), false);
    const intentStr = ui.game.enemy.name + ' ' + intentLine(cur);
    $('intentText').textContent = intentStr;
    // the enemy's act line often repeats the intent line (broken / wagging): show it once
    // once the turn has played out, label the line as last turn's action so it isn't read as the new intent
    const eLine = ui.phase === 'await-roll' && ui.enemyText ? C.text.lastAction + ' ' + ui.enemyText : ui.enemyText;
    $('enemyText').textContent = !ui.enemyText || ui.enemyText === intentStr ?' ' : eLine;
    // foresight queue: up to 2 greyed upcoming intents, in order
    const nw = $('nextWrap');
    if (en.queue.length) {
      const labels = [C.text.next, C.text.then];
      nw.innerHTML = en.queue.map((q, k) => {
        const f = en.faces[q.faceIdx], fs = E.faceStatus(f);
        const col = enemyTileClass(f.name, q.wag ? 'turned' : (fs === 'broken' || fs === 'turned' ? fs : 'intact'));
        return '<span class="q"><span class="lbl">' + labels[k] + '</span><span class="tile small ' + col.cls + '" style="background:' + col.bg + ';color:' + col.fg + '">' +
          esc(f.name) + '</span>' + (en.queue.length === 1 ? '<span>' + esc(intentLine(q)) + '</span>' : '') + '</span>';
      }).join('');
      nw.classList.remove('hidden');
    } else { nw.classList.add('hidden'); nw.innerHTML = ''; }
    // bag / nest: items this enemy has taken
    const bag = $('bag');
    if (!bag.classList.contains('hidden')) {
      const key = (ui.bagLabel || '') + ':' + en.bag.join(',');
      if (bag.dataset.key !== key) {
        bag.dataset.key = key;
        bag.innerHTML = '<span class="lbl">' + esc(ui.bagLabel || 'BAG') + '</span>' + (en.bag.length ? en.bag.map(id => itemTileHTML(id, 'bagpop')).join('') : '<span class="lbl">—</span>');
      }
    }
    $('verbFlash').textContent = ui.verbFlash || '';
  }

  function renderDice() {
    ui.game.player.dice.forEach(d => {
      const el = dom.dieEls[d.id], vd = view.dice[d.id], si = slotOf(d.id);
      const parent = si >= 0 ? dom.slotEls[si] : dom.cellEls[d.id];
      if (el.parentNode !== parent) parent.appendChild(el);
      const hidden = ui.phase === 'await-roll' || ui.phase === 'start';
      const face = hidden ? '?' : vd.faces[vd.idx];
      if (el.dataset.face !== face) {
        el.dataset.face = face;
        el.querySelector('.faceRow').innerHTML = hidden ? '<span class="tile" style="background:' + C.colors.unknownBg + ';color:' + C.colors.unknownFg + '">' + C.text.unknownFace + '</span>' : faceHTML(face);
      }
      el.classList.toggle('in-slot', si >= 0);
      el.classList.toggle('held', d.held && !hidden);
      el.classList.toggle('frozen', !!vd.frozen);
      el.title = vd.frozen ? C.text.s.frozenTip : '';
      el.classList.toggle('dim', hidden);
      el.querySelector('.ctl').style.visibility = canInteract() ? 'visible' : 'hidden';
    });
  }
  function renderSlots() {
    dom.slotEls.forEach((s, i) => {
      s.classList.toggle('full', !!ui.slots[i]);
      s.classList.toggle('acting', ui.actingSlot === i);
    });
    $('slots').classList.toggle('complete', placedCount() === 3 && (ui.phase === 'arranging' || ui.phase === 'resolving' || ui.phase === 'enemy'));
  }
  function currentPreview() {
    if (ui.previewOverride) return ui.previewOverride;
    if (ui.phase === 'arranging') {
      if (placedCount() < 3) return { hint: true, shape: '', text: C.text.placeHint.replace('{n}', placedCount()) };
      const faces = ui.slots.map(id => viewFace(id));
      if (isSite()) {
        const ev = E.evaluateSentence(faces, { site: true });
        const sp = E.sitePreview(ui.game, ev);
        const tg = ui.game.target !== null ? ' (' + MT().target.toLowerCase() + ': ' + (ui.game.target + 1) + ')' : '';
        return { shape: ev.shape, text: ev.text + '  ⇒  ' + sp.text + tg, sentence: faces.map((f, i) => i === ev.mindIndex ? '[' + faceLabel(f) + ']' : faceLabel(f)).join(' ') };
      }
      const ev = E.evaluateSentence(faces, { enemy: ui.game.enemy, tax: ui.game.tax || 0 });
      return { shape: ev.shape, text: ev.text, sentence: faces.map((f, i) => i === ev.mindIndex ? '[' + faceLabel(f) + ']' : faceLabel(f)).join(' ') };
    }
    if (ui.phase === 'await-roll') {
      const log = ui.game.log;
      const fresh = isSite() ? ui.game.turn <= 1 : !log.length;
      return { hint: true, shape: '', text: !fresh && log.length ? C.text.lastTurn + ' ' + log[log.length - 1] : C.text.pressRoll };
    }
    return { hint: true, shape: '', text: '' };
  }
  function renderPreview() {
    const p = currentPreview();
    $('shape').textContent = p.sentence || p.shape || '';
    const t = $('previewText');
    t.innerHTML = p.text ? verbify(p.text) : '&nbsp;';
    t.classList.toggle('hint', !!p.hint);
  }
  function renderControls() {
    const g = ui.game, ph = ui.phase;
    $('btnRoll').disabled = ph !== 'await-roll' || nothingLeft();
    $('btnLeave').disabled = !(ph === 'await-roll' || ph === 'arranging');
    $('btnLeave').classList.toggle('primary', nothingLeft());
    const allHeld = g.player.dice.every(d => d.held || d.frozen);
    $('btnReroll').disabled = !(ph === 'arranging' && g.rerolls > 0 && !allHeld);
    $('btnReroll').textContent = C.text.buttons.reroll.replace('{n}', ph === 'arranging' || ph === 'resolving' || ph === 'enemy' ? g.rerolls : 0);
    $('btnCommit').disabled = !(ph === 'arranging' && placedCount() === 3);
    let s = '';
    if (ph === 'await-roll') {
      const parts = [];
      if (g.rerollPenalty > 0) parts.push(C.text.growlStatus.replace('{n}', Math.max(0, C.rerollsPerTurn - g.rerollPenalty + g.rerollBonus)));
      if (g.rerollBonus > 0) parts.push(C.text.bonusStatus.replace('{n}', g.rerollBonus));
      if (g.pendingSow > 0) parts.push(C.text.sowStatus.replace('{n}', g.pendingSow));
      if (g.tax > 0) parts.push(C.text.s.taxedStatus.replace('{n}', g.tax));
      g.player.dice.forEach(d => { if (d.frozen) parts.push(C.text.s.yourDiceFrozen.replace('{die}', d.id)); });
      s = parts.join(' · ');
    } else if (ph === 'arranging') {
      const parts = [];
      if (g.rerolls === 0 && g.player.dice.some(d => !d.held && !d.frozen)) parts.push(C.text.noRerolls);
      if (g.tax > 0) parts.push(C.text.s.taxedStatus.replace('{n}', g.tax));
      g.player.dice.forEach(d => { if (d.frozen) parts.push(C.text.s.yourDiceFrozen.replace('{die}', d.id)); });
      s = parts.join(' · ');
    }
    $('status').textContent = s;
  }
  function renderTopBar() {
    const enc = ui.screen === 'encounter';
    const n = enc && view ? viewScars() : E.tripScars(ui.trip);
    document.querySelectorAll('#scars .scarbox').forEach((b, i) => b.classList.toggle('on', i < n));
    $('scarN').textContent = n + '/' + C.maxScars;
    $('turn').textContent = enc && ui.game ? C.text.turn + ' ' + ui.game.turn : '';
    $('invCount').textContent = C.text.itemsLabel + ' ' + ui.trip.inventory.length;
    const t = ui.trip;
    const dayEl = $('dayInd'), M = MT();
    dayEl.style.display = t.mode === 'm2' && ui.screen !== 'start' ? 'inline' : 'none';
    if (ui.screen === 'start') { $('stageInd').innerHTML = ''; return; }
    if (t.mode === 'm2') {
      const cold = t.daylight <= 0;
      dayEl.textContent = cold ? M.coldShort : M.dayShort.replace('{n}', t.daylight);
      dayEl.classList.toggle('cold', cold);
      dayEl.title = M.daylight;
      $('stageInd').innerHTML = '<span class="cur">' + M.map + '</span><i>·</i><span>' + esc(M.moves.replace('{n}', t.moves)) + '</span>';
      return;
    }
    // future fights show as '?' until reached (all of them during the intro placement); the campfire is always known
    const intro = ui.screen === 'placement' && ui.placementMode === 'intro';
    $('stageInd').innerHTML = t.sequence.map((id, i) => {
      const cls = t.over ? 'done' : (i < t.stageIdx ? 'done' : (i === t.stageIdx ? 'cur' : ''));
      const known = E.isCampfire(id) || t.over || i < t.stageIdx || (i === t.stageIdx && !intro);
      return '<span class="' + cls + '"' + (known ? '' : ' title="' + esc(C.text.s.unknownFight) + '"') + '>' +
        esc(known ? (C.trip.stageLabels[id] || id) : C.trip.unknownLabel) + '</span>';
    }).join('<i>·</i>');
  }
  function renderOverlay() {
    const ov = $('overlay'), g = ui.game;
    const show = ui.screen === 'encounter' && (ui.phase === 'won' || ui.phase === 'lost' || ui.phase === 'guardian');
    ov.classList.toggle('show', show);
    if (show && ui.phase === 'guardian') {
      const gd = C.enemies[g.guardian];
      $('ovBig').textContent = MT().guardianArrives.replace('{name}', gd.name);
      $('ovBig').style.color = C.colors.verb.PRUNE;
      $('ovBig').style.fontSize = '56px';
      $('ovSub').textContent = MT().guardianSub;
      $('ovRestart').textContent = MT().fight;
    } else if (show && isSite()) {
      $('ovBig').textContent = C.text.lost; $('ovBig').style.color = C.colors.scarText; $('ovBig').style.fontSize = '';
      $('ovSub').textContent = C.text.lostSub; $('ovRestart').textContent = C.text.buttons.continue;
    } else if (show) {
      $('ovBig').style.fontSize = ''; $('ovRestart').textContent = C.text.buttons.continue;
      $('ovBig').textContent = ui.phase === 'won' && g.resultLabel ? g.resultLabel : g.result;
      $('ovBig').style.color = ui.phase === 'lost' ? C.colors.scarText : (g.result === C.text.befriended ? C.colors.turned : C.colors.verb.PRUNE);
      $('ovSub').textContent = ui.phase === 'won'
        ? (g.result === C.text.befriended ? g.enemy.winText.befriended : g.enemy.winText.beaten)
        : C.text.lostSub;
    }
  }

  // popover with all 6 faces
  function showPopover(id) {
    if (ui.drag) return;
    const d = ui.game.player.dice.find(x => x.id === id), vd = view.dice[id];
    const pop = $('pop');
    const shownCur = ui.phase !== 'await-roll' && ui.phase !== 'start';
    const cur = vd.faces[vd.idx], cp = E.parseFace(cur);
    const lines = [];
    if (shownCur) {
      if (cp.kind === 'verb') lines.push('<span style="color:' + C.colors.verb[cp.verb] + '">' + cp.verb + '</span> ' + esc(C.verbInfo[cp.verb]));
      else if (cp.kind === 'body') {
        const fv = C.favouriteVerb[cp.body];
        lines.push(esc(cp.body) + ': favourite verb <span style="color:' + C.colors.verb[fv] + '">' + fv + '</span> (2 points, others 1)');
        if (cp.item) lines.push(esc(itemName(cp.item)) + ': ' + esc(C.items[cp.item].info));
      } else lines.push('SCAR: 0 points');
    }
    if (vd.frozen) lines.push('<span style="color:#8fe0ff">' + esc(C.text.s.frozen) + ':</span> ' + esc(C.text.s.frozenTip));
    if (shownCur && cp.item && C.items[cp.item].special === C.itemRules.wrenchSpecial) lines.push(esc(C.text.s.sturdyTip));
    pop.innerHTML = '<div class="ttl">' + id + ' · 6 faces</div><div class="row">' +
      vd.faces.map((f, i) => '<div class="f' + (i === vd.idx && shownCur ? ' cur' : '') + '"><div class="faceRow">' + faceHTML(f) + '</div></div>').join('') + '</div>' +
      (lines.length ? '<div class="ttl" style="margin:8px 0 0;letter-spacing:.04em;font-weight:400;font-size:12px;color:var(--text);max-width:520px;white-space:normal">' + lines.join('<br>') + '</div>' : '');
    pop.style.display = 'block';
    const sr = $('stage').getBoundingClientRect(), r = dom.dieEls[id].getBoundingClientRect();
    const pw = pop.offsetWidth, ph2 = pop.offsetHeight;
    let x = r.left - sr.left + r.width / 2 - pw / 2;
    x = Math.max(8, Math.min(sr.width - pw - 8, x));
    let y = r.top - sr.top - ph2 - 8;
    if (y < 8) y = r.bottom - sr.top + 8;
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
  }
  function hidePopover() { $('pop').style.display = 'none'; }

  // 'KNIFE TAKEN' / 'KNIFE BORROWED' (by the face that did it)
  const takenText = (ev) => ((C.text.tookBy && C.text.tookBy[ev.by]) || C.text.took).replace('{item}', itemName(ev.item));

  // ---------- player actions ----------
  function placeDie(id, slotIdx) {
    if (!canInteract()) return;
    const cur = slotOf(id), occ = ui.slots[slotIdx];
    if (cur === slotIdx) return;
    if (cur >= 0) ui.slots[cur] = occ;      // swap (occ may be null)
    ui.slots[slotIdx] = id;                 // an evicted occupant simply returns to its tray cell
    renderAll();
  }
  function unplaceDie(id) {
    if (!canInteract()) return;
    const i = slotOf(id);
    if (i >= 0) { ui.slots[i] = null; renderAll(); }
  }
  function onUp(id) { if (slotOf(id) < 0) { const i = ui.slots.indexOf(null); if (i >= 0) withFlip(id, () => placeDie(id, i)); } }
  function onDown(id) { withFlip(id, () => unplaceDie(id)); }
  function toggleHoldDie(id) {
    if (!canInteract()) return;
    if (dieById(id).frozen) { hooks.onFrozenClick(id); return; }
    E.toggleHold(dieById(id));
    renderAll();
    hooks.onHold(id);
    if (ui.hover === id) showPopover(id);
  }
  // Run a placement change and let FX animate every die that moved (FLIP).
  function withFlip(id, fn) { const snap = hooks.snapshot(); fn(); hooks.play(snap, id); }
  function onKey(e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if ((e.key === '1' || e.key === '2' || e.key === '3') && ui.hover && canInteract()) {
      withFlip(ui.hover, () => placeDie(ui.hover, Number(e.key) - 1));
      if (ui.hover) showPopover(ui.hover);
    }
  }

  // Pointer Events drag & drop. < 5px of movement = click = toggle hold.
  function onPointerDown(e, id) {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest('button')) return;
    if (!canInteract()) return;
    const el = dom.dieEls[id];
    const r = el.getBoundingClientRect();
    ui.drag = { id, pointerId: e.pointerId, sx: e.clientX, sy: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top,
      w: r.width, h: r.height, active: false };
    el.setPointerCapture(e.pointerId);
    el.addEventListener('pointermove', onPointerMove);
    el.addEventListener('pointerup', onPointerUp);
    el.addEventListener('pointercancel', onPointerCancel);
  }
  function dropTarget(x, y) {
    for (let i = 0; i < 3; i++) {
      const r = dom.slotEls[i].getBoundingClientRect();
      const m = C.ui.dropSlackPx;
      if (x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m) return { kind: 'slot', i };
    }
    const tr = $('bottom').getBoundingClientRect();
    if (y >= tr.top - C.ui.dropSlackPx) return { kind: 'tray' };
    return null;
  }
  function onPointerMove(e) {
    const d = ui.drag; if (!d || e.pointerId !== d.pointerId) return;
    const el = dom.dieEls[d.id];
    if (!d.active) {
      if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < C.ui.dragThresholdPx) return;
      d.active = true;
      hidePopover();
      el.style.width = d.w + 'px'; el.style.height = d.h + 'px';
      el.classList.add('dragging');
      hooks.onDragStart(el, d);
    }
    el.style.left = (e.clientX - d.ox) + 'px';
    el.style.top = (e.clientY - d.oy) + 'px';
    hooks.onDragMove(el, e, d);
    const t = dropTarget(e.clientX, e.clientY);
    dom.slotEls.forEach((s, i) => s.classList.toggle('over', !!t && t.kind === 'slot' && t.i === i));
    $('tray').classList.toggle('over', !!t && t.kind === 'tray' && slotOf(d.id) >= 0);
  }
  function endDrag(e, cancelled) {
    const d = ui.drag; if (!d || e.pointerId !== d.pointerId) return;
    const el = dom.dieEls[d.id];
    const snap = d.active ? hooks.snapshot() : null;            // positions while still lifted (for the drop animation)
    el.removeEventListener('pointermove', onPointerMove);
    el.removeEventListener('pointerup', onPointerUp);
    el.removeEventListener('pointercancel', onPointerCancel);
    try { el.releasePointerCapture(d.pointerId); } catch (_) {}
    ui.drag = null;
    const wasActive = d.active;
    el.classList.remove('dragging');
    el.style.width = el.style.height = el.style.left = el.style.top = el.style.rotate = '';
    hooks.onDragEnd(el, d);
    dom.slotEls.forEach(s => s.classList.remove('over'));
    $('tray').classList.remove('over');
    if (cancelled) { renderAll(); return; }
    if (!wasActive) { toggleHoldDie(d.id); return; }          // click
    const t = dropTarget(e.clientX, e.clientY);
    if (t && t.kind === 'slot') placeDie(d.id, t.i);
    else if (t && t.kind === 'tray') unplaceDie(d.id);
    // else: invalid drop -> element returns to its container; FX animates it back (hooks.play)
    renderAll();
    if (snap) hooks.play(snap, d.id, true);
    if (ui.hover === d.id) showPopover(d.id);
  }
  function onPointerUp(e) { endDrag(e, false); }
  function onPointerCancel(e) { endDrag(e, true); }

  async function onRoll() {
    if (ui.phase !== 'await-roll') return;
    const g = ui.game;
    syncView();                                     // pre-turn picture: a pending watering-can SOW plays from here
    const st = E.startTurn(g, Math.random);
    ui.slots = [null, null, null];
    ui.previewOverride = null; ui.enemyText = ''; ui.verbFlash = ''; ui.actingSlot = null;
    if (st.events.length) {
      const run = ++ui.runId;
      ui.phase = 'start';
      hidePopover();
      renderAll();
      await playEvents(st.events, run);
      if (ui.runId !== run) return;
      ui.verbFlash = ''; ui.enemyText = '';
    }
    syncView();
    if (st.over) { ui.phase = st.over; renderAll(); return; }   // the pending SOW finished the fight
    ui.phase = 'arranging';
    hooks.onRoll(g.player.dice.map(d => d.id));
    renderAll();
  }
  function onReroll() {
    if (!canInteract()) return;
    const ids = E.rerollUnheld(ui.game, Math.random);
    if (!ids) return;
    syncView();
    hooks.onRoll(ids);
    renderAll();
    if (ui.hover) showPopover(ui.hover);
  }
  // A brand-new trip (mode 'm1' = random fight sequence, 'm2' = map). Every trip starts on the intro placement screen:
  // bare dice, the starting inventory (CONFIG.startingInventory) is packed onto them there.
  function startTrip(mode) {
    ui.runId++;
    hooks.onRestart();
    ui.trip = mode === 'm2' ? E.createTrip(Math.random, 'm2') : E.createTrip(Math.random);
    ui.game = null; view = null;
    ui.reward = null; ui.healing = false; ui.mapMsg = null; ui.mapFlash = null; ui.mapBusy = false; ui.jumpRestore = null;
    hidePopover();
    openPlacement('intro');
  }
  // RESTART TRIP: a brand-new trip (same mode as the current one) from the intro screen.
  function onRestart() { startTrip(ui.trip && ui.trip.mode === 'm2' ? 'm2' : 'm1'); }
  // Start choice: M1 sequence or M2 map.
  function showStart() {
    ui.runId++;
    hooks.onRestart();
    ui.game = null; view = null; ui.reward = null; ui.healing = false;
    ui.screen = 'start'; ui.phase = 'screen';
    hidePopover();
    renderAll();
  }

  // ---------- trip flow ----------
  // Finishes the current stage (M1: next sequence entry; M2: the tile resolves, back to the map). A debug jump made from
  // the map puts the tile under the player back as it was.
  function advance() {
    const t = ui.trip;
    const r = E.advanceStage(t);
    if (ui.jumpRestore && t.map) {
      const tile = t.map.tiles[ui.jumpRestore.r][ui.jumpRestore.c];
      Object.assign(tile, ui.jumpRestore.fields);
      ui.jumpRestore = null;
    }
    return r;
  }
  // Starts whatever the trip's current stage is: an encounter, the campfire, or the end screen.
  function enterStage() {
    const t = ui.trip;
    ui.runId++;
    hidePopover();
    ui.reward = null; ui.healing = false;
    if (t.over || !t.stage) { showEnd(); return; }
    if (t.stage === C.trip.mapStage) {      // M2: back on the map
      ui.game = null; view = null;
      ui.screen = 'map'; ui.phase = 'map'; ui.mapBusy = false;
      renderAll();
      return;
    }
    if (E.isCampfire(t.stage)) {
      ui.screen = 'campfire'; ui.phase = 'screen';
      renderAll();
      return;
    }
    if (t.stage === C.trip.siteStage || C.sites[t.stage]) {     // scavenge site (M2 SITE stage: already created by moveTo / debug jump)
      const site = t.stage === C.trip.siteStage && t.site ? t.site : E.startSite(t, t.stage, Math.random);
      ui.game = site;
      ui.screen = 'encounter'; ui.phase = 'await-roll';
      ui.slots = [null, null, null];
      ui.pipRec = site.faces.map(() => []);
      ui.previewOverride = null; ui.enemyText = ''; ui.verbFlash = ''; ui.actingSlot = null;
      hooks.onRestart();
      buildSitePanel();
      syncView();
      renderAll();
      return;
    }
    const pending = t.encounter;            // M2 tile / guardian: the engine already started this fight
    ui.game = pending && pending.enemyId === t.stage && !pending.over && pending.turn === 1 && !pending.log.length
      ? pending : E.startEncounter(t, t.stage, Math.random);
    ui.screen = 'encounter'; ui.phase = 'await-roll';
    ui.slots = [null, null, null];
    ui.previewOverride = null; ui.enemyText = ''; ui.verbFlash = ''; ui.actingSlot = null;
    hooks.onRestart();
    buildEnemyPanel();
    syncView();
    renderAll();
  }
  function showEnd() {
    ui.screen = 'end'; ui.phase = 'screen'; ui.reward = null; ui.healing = false;
    hidePopover();
    renderAll();
  }
  // CONTINUE on the encounter result overlay: lost -> end screen, won -> reward screen.
  function onContinue() {
    if (ui.screen !== 'encounter') return;
    const g = ui.game, t = ui.trip;
    if (g.over === 'lost' || t.over === 'lost') { showEnd(); return; }
    if (ui.phase === 'guardian') { enterStage(); return; }     // the noise brought the guardian: fight it
    if (g.over !== 'won') return;
    const info = E.rewardsFor(t, g.result);
    if (info.empty) {                       // nothing to get: no reward screen, no placement
      E.claimReward(t, g.result, null, Math.random);
      advance();
      enterStage();
      return;
    }
    ui.reward = { result: g.result, label: g.resultLabel || g.result, info, lost: info.returned.length ? [] : g.taken.slice(), picked: null };
    ui.screen = 'reward'; ui.phase = 'screen';
    renderAll();
  }
  // Reward -> placement. The placement screen is entered ONLY through openPlacement(mode); mode is 'reward' | 'campfire'.
  function claimAndPlace(pick) {
    const t = ui.trip, r = ui.reward;
    const res = E.claimReward(t, r.result, pick, Math.random);
    if (!res.ok) return;
    if (res.revealed && res.revealed.length) {
      ui.mapFlash = res.revealed;
      ui.mapMsg = { text: MT().revealedMsg.replace('{n}', res.revealed.length), cold: false };
    }
    openPlacement('reward');
  }
  function openPlacement(mode) {
    ui.placementMode = mode;
    ui.place.sel = null; ui.place.pending = null;
    E.beginPlacement(ui.trip, mode);
    ui.screen = 'placement'; ui.phase = 'screen'; ui.healing = false;
    renderAll();
  }
  // DONE on the placement screen: locks the placement in and moves to the next stage of the trip
  // (intro: the trip's first stage was never played, so nothing advances).
  function closePlacement() {
    const intro = ui.placementMode === 'intro';
    ui.place.sel = null; ui.place.pending = null;
    E.endPlacement(ui.trip);
    if (!intro) advance();
    enterStage();
  }
  function healFace(dieId, idx) {
    const r = E.healScar(ui.trip, dieId, idx);
    if (!r.ok) return;
    ui.healing = false;
    renderAll();
    hooks.onHeal(dieId, idx);
    ui.runId++;
    const run = ui.runId;
    setTimeout(() => { if (ui.runId === run) { advance(); enterStage(); } }, 650);
  }

  // One step on the M2 map. The engine resolves the whole move at once (daylight, cold scar, entering the tile);
  // the UI shows the end state and FX animates the marker / sun / cold, then the tile's screen opens.
  async function onMapMove(c, r) {
    if (ui.screen !== 'map' || ui.mapBusy) return;
    const t = ui.trip;
    const you = document.querySelector('#screen .mt.here .you');
    const prevRect = you ? you.getBoundingClientRect() : null;
    const out = E.moveTo(t, c, r, Math.random);
    if (!out.ok) return;
    ui.mapBusy = true;
    const run = ++ui.runId;
    const mv = out.events.find(e => e.type === 'move');
    const scar = out.events.find(e => e.type === 'scar'), des = out.events.find(e => e.type === 'itemDestroyed');
    const M = MT();
    ui.mapMsg = mv.cold ? { text: M.coldMsg + (des ? ' ' + M.coldDestroyed.replace('{item}', itemName(des.item)) : ''), cold: true } : null;
    renderAll();
    hooks.onMapMove({ prevRect, move: mv, cold: mv.cold, scar, destroyed: des, entered: out.entered, won: out.over === 'won', lost: out.over === 'lost', to: { c, r } });
    await sleep(mv.cold ? 700 : 0);
    if (ui.runId !== run) return;
    if (t.over) { ui.mapBusy = false; showEnd(); return; }
    if (out.entered && ['CHARACTER', 'SCAVENGE', 'CAMPFIRE'].indexOf(out.entered.tile) >= 0) { ui.mapMsg = null; enterStage(); return; }
    ui.mapBusy = false;
  }

  // ---------- debug-facing trip controls (the DEBUG drawer calls these through SmugUI) ----------
  // Any enemy id or the campfire. An id missing from the random sequence replaces the current fight (or the next one).
  function jumpTo(stageId) {
    const t = ui.trip;
    if (t.mode === 'm2') {                  // M2: any enemy, site, the campfire, or back to the map
      const mapId = C.trip.mapStage;
      if (stageId !== mapId && !C.enemies[stageId] && !C.sites[stageId] && !E.isCampfire(stageId)) return false;
      if (t.stage === mapId && t.map && !ui.jumpRestore) {
        const p = t.map.pos, tl = t.map.tiles[p.r][p.c];
        ui.jumpRestore = { c: p.c, r: p.r, fields: { type: tl.type, enemyId: tl.enemyId, siteId: tl.siteId } };
      }
      t.over = null; t.result = null; t.encounter = null; t.placement = null; t.site = null;
      if (stageId === mapId) { t.stage = mapId; ui.jumpRestore = null; }
      else if (C.sites[stageId]) { E.startSite(t, stageId, Math.random, null); }
      else t.stage = stageId;
      hooks.onRestart();
      enterStage();
      return true;
    }
    let i = t.sequence.indexOf(stageId);
    if (i < 0) {
      if (!C.enemies[stageId] && !C.sites[stageId] && !E.isCampfire(stageId)) return false;
      i = Math.min(t.stageIdx, t.sequence.length - 1);
      while (i < t.sequence.length - 1 && E.isCampfire(t.sequence[i])) i++;
      if (E.isCampfire(t.sequence[i])) return false;
      t.sequence[i] = stageId;
    }
    t.over = null; t.result = null; t.stageIdx = i; t.stage = stageId; t.encounter = null; t.placement = null; t.site = null;
    hooks.onRestart();
    enterStage();
    return true;
  }
  function giveItem(id) {
    if (!C.items[id]) return false;
    E.addToInventory(ui.trip, id);
    renderAll();
    return true;
  }
  // Marks every hostile face resolved (BEATEN = broken, BEFRIENDED = turned) and ends the encounter as the engine would.
  function forceWin(result) {
    if (ui.screen !== 'encounter' || !ui.game || ui.game.over || isSite()) return false;
    const g = ui.game, to = result === C.text.beaten ? 'broken' : 'turned';
    g.enemy.faces.forEach(f => { if (f.hostile) f.pips = f.pips.map(() => to); });
    g.over = 'won'; g.result = result; g.resultLabel = E.labelFor(g.enemy, result);
    ui.trip.results.push({ enemyId: g.enemyId, result, label: g.resultLabel, turns: g.turn });
    ui.runId++;
    syncView(); ui.phase = 'won'; ui.enemyText = result;
    renderAll();
    return true;
  }
  // Scars random bare / item faces on HAND + HEAD until the trip has n scars (items on them are destroyed).
  function addScars(n) {
    const t = ui.trip;
    const faces = [];
    C.biteTargets.forEach(id => t.dice.find(d => d.id === id).faces.forEach((f, i) => { if (f !== C.text.scar) faces.push({ id, i }); }));
    while (E.tripScars(t) < n && faces.length) {
      const k = Math.floor(Math.random() * faces.length), f = faces.splice(k, 1)[0];
      t.dice.find(d => d.id === f.id).faces[f.i] = C.text.scar;
    }
    if (ui.screen === 'encounter') syncView();
    renderAll();
  }
  // total scars -> n (adds random scars, or heals scars back to bare parts)
  function setScars(n) {
    const t = ui.trip;
    n = Math.max(0, Math.min(C.maxScars - 1, n));
    if (n > E.tripScars(t)) { addScars(n); return; }
    t.dice.forEach(d => {
      const orig = C.playerDice.find(x => x.id === d.id);
      d.faces.forEach((f, i) => { if (f === C.text.scar && E.tripScars(t) > n) d.faces[i] = orig.faces[i].split('+')[0]; });
    });
    if (ui.screen === 'encounter' && ui.game) syncView();
    renderAll();
  }
  function setDaylight(n) {
    const t = ui.trip;
    if (t.mode !== 'm2') return false;
    t.daylight = Math.max(0, Math.min(C.map.daylight, n));
    renderAll();
    return true;
  }
  function setNoise(n) {
    if (!isSite()) return false;
    ui.game.noise = Math.max(0, Math.min(ui.game.noiseMax, n));
    syncView(); renderAll();
    return true;
  }
  function setShowMap(on) { ui.showMap = !!on; if (ui.screen === 'map') renderAll(); }
  function setShowSite(on) { ui.showSite = !!on; if (isSite() && ui.screen === 'encounter') { syncView(); renderAll(); } }
  function forceLose() {
    addScars(C.maxScars);
    const t = ui.trip, g = ui.game;
    t.over = 'lost'; t.result = C.text.lost;
    ui.runId++;
    if (ui.screen === 'encounter' && g && !g.over) { g.over = 'lost'; g.result = C.text.lost; syncView(); ui.phase = 'lost'; renderAll(); }
    else showEnd();
  }

  // ---------- trip screens (simple DOM, rebuilt on change) ----------
  const part = (id) => C.items[id].part;
  function verbLines(id) {
    const d = C.items[id];
    return C.verbs.map(v => '<div><b style="color:' + C.colors.verb[v] + '" title="' + esc(C.verbInfo[v]) + '">' + v + '</b>' + esc(d.names[v]) + '</div>').join('');
  }
  function itemCardHTML(id, cls, i) {
    const d = C.items[id];
    return '<div class="rcard ' + (cls || '') + ' pop-in" style="--i:' + (i || 0) + '" data-item="' + id + '">' +
      '<div class="tiles">' + tileHTML(d.part) + itemTileHTML(id) + '</div>' +
      '<div class="info">' + esc(d.info) + '</div><div class="verbs">' + verbLines(id) + '</div></div>';
  }
  // ---------- die nets (placement, campfire heal, end screen) ----------
  // o.mode: 'place' (items draggable / droppable) | 'heal' (scar faces clickable) | 'view'; o.mini: compact size.
  function netHTML(dieId, o) {
    o = o || {};
    const t = ui.trip, die = t.dice.find(d => d.id === dieId), S = C.text.s;
    const placing = o.mode === 'place', mode = ui.placementMode, sel = ui.place.sel;
    const sturdy = (item) => item && C.items[item].special === C.itemRules.wrenchSpecial;
    const cells = die.faces.map((f, i) => {
      const p = E.parseFace(f);
      const cls = ['nf', 'p' + i];
      let attrs = ' data-die="' + dieId + '" data-idx="' + i + '"', inner;
      if (p.kind === 'scar') {
        cls.push('scar');
        if (o.mode === 'heal') { cls.push('heal'); attrs += ' data-act="healFace" title="' + esc(S.healTip) + '"'; }
        inner = tileHTML(C.text.scar, 'small');
      } else {
        inner = '<div class="bp">' + tileHTML(p.body, 'small') + '</div>';
        if (p.item) {
          const locked = placing && E.isLocked(t, dieId, i, mode);
          inner += '<div class="it ' + (placing ? (locked ? 'locked' : 'movable') : '') + (sel && sel.kind === 'face' && sel.die === dieId && sel.idx === i ? ' selected' : '') + '"' +
            (placing && !locked ? ' data-drag="face" data-item="' + p.item + '"' : '') + (locked ? ' title="' + esc(S.lockedTip) + '"' : '') + '>' +
            itemTileHTML(p.item, 'small') + (locked ? '<i class="lock">🔒</i>' : (placing && mode === 'reward' ? '<b class="new">' + S.newTag + '</b>' : '')) +
            (sturdy(p.item) ? '<b class="sturdy" title="' + esc(S.sturdyTip) + '">' + S.sturdy + '</b>' : '') + '</div>';
        } else inner += '<div class="it empty">' + (o.mini ? '' : S.slotEmpty) + '</div>';
        if (placing && sel) {
          const src = sel.item, c = E.canPlace(t, src, dieId, i, mode);
          if (c.ok && !(sel.kind === 'face' && sel.die === dieId && sel.idx === i)) cls.push('valid', 'selvalid');
        }
      }
      return '<div class="' + cls.join(' ') + '"' + attrs + '><span class="n">' + (i + 1) + '</span>' + inner + '</div>';
    });
    return '<div class="net' + (o.mini ? ' mini' : '') + '" data-net="' + dieId + '">' + cells.join('') + '</div>';
  }
  const oddsHTML = (dieId) => '<div class="odds" data-odds="' + dieId + '">' + esc(E.oddsSummary(ui.trip.dice.find(d => d.id === dieId)).text) + '</div>';
  function netBoxHTML(dieId, o) {
    return '<div class="netbox"><div class="nbl">' + dieId + '</div>' + netHTML(dieId, o) + oddsHTML(dieId) + '</div>';
  }
  function mindRowHTML() {
    const die = ui.trip.dice.find(d => d.id === C.mindDieId);
    return '<div class="dicelist"><div class="dl"><span class="nm">' + die.id + '</span><div class="faces">' +
      die.faces.map(f => '<span class="f">' + faceHTML(f, 'small') + '</span>').join('') + '</div></div></div>';
  }
  const btn = (label, act, extra) => '<button class="btn primary" data-act="' + act + '"' + (extra || '') + '>' + esc(label) + '</button>';

  const SCREENS = {
    reward(root) {
      const r = ui.reward, S = C.text.s, info = r.info;
      const beaten = info.ending === 'beaten';
      let h = '<h2 style="color:' + (beaten ? C.colors.verb.PRUNE : C.colors.turned) + '">' + esc(r.label || r.result) + '</h2>' +
        '<div class="sub">' + esc(ui.game.enemy.winText[info.ending]) + '</div>';

      return Math.max(0, sv.faces.findIndex(f => !f.opened));

    if (en.current && !en.current.wag && ok(en.current.faceIdx)) return en.current.faceIdx;
    for (const nm of U.game.enemy.targetPriority) for (let i = 0; i < en.faces.length; i++) if (en.faces[i].name === nm && ok(i)) return i;
    return en.current ? en.current.faceIdx : 0;

        burst(at, col, FXC.burstCounts.win);
        floatText(d ? d.name : ev.item, { x: at.x, y: at.y - 50 }, col, { small: false });
        fly(d ? d.name : ev.item, at, ctr($('invCount')), col, { small: true, ms: T.flyMs + 260, lift: -80 });
      } else if (ev.content === 'RATS' || ev.content === 'TRAP') {
        shake(card, FXC.scarShakePx, T.crackMs + 200);
        burst(at, SC[ev.content], FXC.burstCounts.scar);
        floatText(ev.content + '!', { x: at.x, y: at.y - 50 }, SC[ev.content], { small: false });
      } else {
        floatText(ev.content, { x: at.x, y: at.y - 50 }, C.colors.textDim, { small: false });
      }
      await p;
    });
    wrap('guardian', async (ev, orig) => {
      const p = orig(ev);
      shake($('noiseTrack'), FXC.shakePx + 3, 500);
      shake($('stage'), FXC.loseShakePx, FXC.loseShakeMs);
      floatText(ev.name, ctr($('noiseTrack')), C.colors.verb.PRUNE, { small: false });
      await p;
    });
  }

  // ---------- init ----------
  function init() {
    U = window.SmugUI; dom = U.dom;
    const H = U.hooks;
    H.onRoll = (ids) => startShuffle(ids);
    H.onHold = onHold;
    H.onFrozenClick = (id) => { const el = dom.dieEls[id]; shake(el, FXC.growlShakePx + 2, 260); floatText(C.text.frozenFloat, ctr(el), '#8fe0ff', { small: false }); };
    H.onRestart = reset;
    H.onDragStart = onDragStart; H.onDragMove = onDragMove; H.onDragEnd = onDragEnd;
    H.snapshot = snapshot; H.play = play;
    // reward pick: the chosen card pops (screens animate in with the CSS .pop-in entrance)
    H.onPick = (el) => { if (el) popAnim(el, 1.12, 320); };
    // campfire heal: the healed face flashes green
    H.onHeal = () => {
      const at = { x: 640, y: 360 };
      floatText('HEALED', at, C.colors.turned, { small: false });
      burst(at, C.colors.turned, FXC.burstCounts.win);
    };

    // ---- placement screen (all reactions to the player's drag / click) ----
    const faceAt = (dieId, idx) => document.querySelector('#screen .nf[data-die="' + dieId + '"][data-idx="' + idx + '"]');
    H.onDragItem = (g) => { motion(g, [{ scale: '.8' }, { scale: '1.12' }], { duration: 120, fill: 'forwards' }); };
    // invalid drop target: a short shake
    H.onReject = (el) => {
      if (!el) return;
      el.classList.remove('rej'); void el.offsetWidth; el.classList.add('rej');
      setTimeout(() => el.classList.remove('rej'), 340);
    };
    // the ghost returns to where the item came from, with overshoot
    H.onItemReturn = (ghost, from, done) => {
      if (!ghost) { done(); return; }
      const m = /translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(ghost.style.transform || '');
      const cur = m ? { x: +m[1], y: +m[2] } : from;
      const fin = () => { if (ghost.parentNode) ghost.remove(); done(); };
      if (reduced()) { fin(); return; }
      const a = ghost.animate([{ transform: 'translate(' + cur.x + 'px,' + cur.y + 'px) rotate(0)' },
        { transform: 'translate(' + from.x + 'px,' + from.y + 'px) rotate(0)' }], { duration: T.returnMs, easing: 'cubic-bezier(.3,1.7,.5,1)', fill: 'forwards' });
      a.onfinish = fin; a.oncancel = fin;
    };
    // an item landed: the face squashes, the net does a small punch scale, sparks; a replaced item breaks apart
    H.onPlace = (dieId, idx, item, replaced) => {
      const nf = faceAt(dieId, idx);
      if (!nf) return;
      const col = C.colors.item[item] || '#b967ff', at = ctr(nf);
      const net = nf.parentNode, tile = nf.querySelector('.it .tile');
      motion(net, [{ transform: 'scale(1)' }, { transform: 'scale(' + FXC.netPunchScale + ')', offset: .35 }, { transform: 'scale(1)' }],
        { duration: T.netPunchMs, easing: 'ease-out' });
      motion(tile || nf, FXC.squash.map((q, i, arr) => ({ transform: 'scale(' + q[0] + ',' + q[1] + ')', offset: (i + 1) / (arr.length + 1) }))
        .concat([{ transform: 'scale(1,1)' }]), { duration: T.squashMs + 120, delay: 200 });
      setTimeout(() => burst(at, col, FXC.particles), 260);
      if (replaced) {
        const d = C.items[replaced], rc = C.colors.item[replaced] || '#b967ff';
        floatText((d ? d.name : replaced) + ' DISCARDED', { x: at.x, y: at.y - 46 }, C.colors.scarText, { small: false });
        if (!reduced()) [['inset(0 50% 0 0)', -1], ['inset(0 0 0 50%)', 1]].forEach(h => {
          const n = document.createElement('div');
          n.className = 'flyer';
          n.style.cssText = 'font-size:16px;padding:6px 9px;background:' + rc + ';color:' + C.colors.tileText + ';border:3px solid #000;clip-path:' + h[0] + ';-webkit-text-stroke:0;text-shadow:none';
          n.textContent = d ? d.name : replaced;
          addLive(n);
          const at0 = 'translate(' + at.x + 'px,' + at.y + 'px) translate(-50%,-50%)';
          const a = n.animate([{ transform: at0, opacity: 1 },
            { transform: at0 + ' translate(' + (h[1] * 5) + 'px,-6px) rotate(' + (h[1] * 8) + 'deg)', opacity: 1, offset: .2 },
            { transform: at0 + ' translate(' + (h[1] * 40) + 'px,60px) rotate(' + (h[1] * 55) + 'deg)', opacity: 0 }], { duration: 600, easing: 'ease-in' });
          a.onfinish = a.oncancel = () => sweep(n);
        });
      }
    };
    H.onUnplace = (item) => {
      const tr = $('invTray');
      if (tr) motion(tr, [{ transform: 'scale(1)' }, { transform: 'scale(1.03)', offset: .4 }, { transform: 'scale(1)' }], { duration: 220 });
    };
    // site: clicking a face to aim at it
    H.onTarget = (el, on) => { popAnim(el, on ? 1.12 : 1.04, 160); };
    // map: kept functional (instant update, no effects); the cold is shown by the message line and the scar tiles
    H.onMapMove = () => {};
    installHandlers();

    // sentence completes: all three tiles pulse together (glow itself is CSS on #slots.complete)
    let wasComplete = false;
    new MutationObserver(() => {
      const c = $('slots').classList.contains('complete');
      if (c && !wasComplete && U.ui.phase === 'arranging') {
        U.ui.slots.forEach(id => { if (id) popAnim(dom.dieEls[id], FXC.litPopScale, FXC.litPopMs); });
      }
      wasComplete = c;
    }).observe($('slots'), { attributes: true, attributeFilter: ['class'] });

    window.SmugFX = { reset, burst, fly, floatText, reduced };
  }
  document.addEventListener('DOMContentLoaded', init);
})();
/* FX END */

/* DEBUG START */
// Debug / tuning drawer. Own IIFE; talks to the game only through window.SmugUI (game state is edited in place, then
// SmugUI.syncView() + SmugUI.renderAll()). Closed by default; toggle with the DEBUG button or the ` key.
(function () {
  const E = globalThis.SmugEngine, C = CONFIG;
  const $ = (id) => document.getElementById(id);
  let U, panel, open = false, sig = '';

  const busy = () => U.ui.phase === 'resolving' || U.ui.phase === 'enemy';   // commit playback running
  const isSite = () => !!U.game && U.game.siteId !== undefined;
  const live = () => U.ui.screen === 'encounter' && !isSite() && (U.ui.phase === 'await-roll' || U.ui.phase === 'arranging');
  const refreshGame = () => { U.syncView(); U.renderAll(); if (U.ui.hover) { const d = U.ui.hover; U.dom.dieEls[d].dispatchEvent(new Event('pointerenter')); } };

  // ---------- actions (also the console API: SmugDebug.*) ----------
  function setFace(dieId, idx) {
    if (U.ui.phase !== 'arranging') return false;
    const die = U.game.player.dice.find(d => d.id === dieId);
    if (!die || !(idx >= 0 && idx < die.faces.length)) return false;
    die.idx = idx; refreshGame(); return true;
  }
  function addRerolls(n) {
    if (U.ui.phase !== 'arranging') return false;
    U.game.rerolls = Math.max(0, U.game.rerolls + n); refreshGame(); return true;
  }
  function resetEnemy() {
    if (!live()) return false;
    U.game.enemy = E.createEnemy(U.game.enemyId, Math.random);
    U.ui.enemyText = ''; U.ui.verbFlash = '';
    refreshGame(); return true;
  }
  function setIntent(faceIdx) {
    if (!live()) return false;
    const en = U.game.enemy, f = en.faces[faceIdx];
    if (!f) return false;
    en.current = { faceIdx, wag: E.faceStatus(f) === 'turned' };
    U.ui.enemyText = '';
    refreshGame(); return true;
  }
  function clearScars() {
    if (!live()) return false;
    U.game.player.dice.forEach(d => {
      const orig = C.playerDice.find(x => x.id === d.id);
      if (orig) d.faces = d.faces.map((f, i) => (f === C.text.scar ? orig.faces[i].split('+')[0] : f));
    });
    refreshGame(); return true;
  }
  // force the ACCOUNTANT's statuses without playing the face: tax for the coming sentence, a frozen die
  function setTax(n) {
    if (!U.game || U.ui.screen !== 'encounter') return false;
    U.game.tax = n; refreshGame(); return true;
  }
  function freezeDie(dieId) {
    if (!U.game || U.ui.screen !== 'encounter') return false;
    const die = U.game.player.dice.find(d => d.id === dieId && d.id !== C.mindDieId);
    if (!die) return false;
    die.frozen = !die.frozen; if (die.frozen) die.held = false;
    refreshGame(); return true;
  }
  function setHidePips(hide) {
    U.ui.hidePips = !!hide;
    U.render.renderEnemy();
    syncPanel(true);
  }

  // trip controls (also console API)
  function giveItem(id) { const ok = U.giveItem(id); syncPanel(true); return ok; }
  function jumpTo(id) { const ok = U.jumpTo(id); syncPanel(true); return ok; }
  function addScars(n) { U.addScars(n); syncPanel(true); }
  function forceLose() { U.forceLose(); syncPanel(true); }
  function setDaylight(n) { const ok = U.setDaylight(n); syncPanel(true); return ok; }
  function setNoise(n) { const ok = U.setNoise(n); syncPanel(true); return ok; }
  function setScars(n) { U.setScars(n); syncPanel(true); }

  // ---------- panel ----------
  let intentFor = '';
  function build() {
    const stage = $('stage');
    const btn = document.createElement('button');
    btn.id = 'btnDebug'; btn.textContent = 'DEBUG'; btn.title = 'Debug / tuning panel (`)';
    $('top').appendChild(btn);
    btn.addEventListener('click', () => toggle());

    panel = document.createElement('aside');
    panel.id = 'dbg';
    panel.innerHTML =
      '<h4>ENEMY VIEW</h4>' +
      '<label class="chk"><input type="checkbox" id="dbgShow"> show all enemy faces and pips</label>' +
      '<h4>PLAYER DICE · SET SHOWN FACE</h4><div id="dbgDice"></div>' +
      '<h4>REROLLS</h4><div class="row"><button class="dbtn" id="dbgRrMinus">− 1</button>' +
      '<button class="dbtn" id="dbgRrPlus">+ 1</button><span id="dbgRr"></span></div>' +
      '<h4>ENEMY</h4><div class="row"><label>intent</label><select id="dbgIntent"></select></div>' +
      '<div class="row"><button class="dbtn" id="dbgReset">RESET ENEMY</button><button class="dbtn" id="dbgScars">CLEAR SCARS</button></div>' +
      '<div class="row"><button class="dbtn" id="dbgTax">TAX NEXT SENTENCE</button><button class="dbtn" id="dbgFrzH">FREEZE HAND</button>' +
      '<button class="dbtn" id="dbgFrzE">FREEZE HEAD</button></div>' +
      '<div id="dbgNote"></div>' +
      '<h4>M2 · MAP AND SITES</h4>' +
      '<label class="chk"><input type="checkbox" id="dbgMap"> reveal the whole map</label>' +
      '<label class="chk"><input type="checkbox" id="dbgSite"> show site contents</label>' +
      '<div class="row"><label>daylight</label><input type="number" id="dbgDay" min="0" max="12" value="12" style="width:54px"><button class="dbtn" id="dbgDaySet">SET</button></div>' +
      '<div class="row"><label>noise</label><input type="number" id="dbgNoise" min="0" max="6" value="0" style="width:54px"><button class="dbtn" id="dbgNoiseSet">SET</button></div>' +
      '<div class="row"><label>scars</label><input type="number" id="dbgScarN" min="0" max="5" value="0" style="width:54px"><button class="dbtn" id="dbgScarSet">SET</button></div>' +
      '<div class="row"><button class="dbtn" id="dbgStartM1">NEW M1 TRIP</button><button class="dbtn" id="dbgStartM2">NEW M2 TRIP</button><button class="dbtn" id="dbgMode">MODE SELECT</button></div>' +
      '<h4>TRIP</h4>' +
      '<div class="row"><label>give</label><select id="dbgItem"></select><button class="dbtn" id="dbgGive">GIVE</button></div>' +
      '<div class="row"><label>jump</label><select id="dbgJump"></select><button class="dbtn" id="dbgJumpGo">GO</button></div>' +
      '<div class="row"><button class="dbtn" id="dbgWinB">WIN: BEATEN</button><button class="dbtn" id="dbgWinF">WIN: BEFRIENDED</button></div>' +
      '<div class="row"><button class="dbtn" id="dbgScar1">+1 SCAR</button><button class="dbtn" id="dbgScarM">SCARS = MAX−1</button><button class="dbtn" id="dbgLose">FORCE LOSE</button></div>' +
      '<h4>TURN LOG · NEWEST FIRST</h4><ol id="dbgLog"></ol>';
    stage.appendChild(panel);

    const dice = $('dbgDice');
    C.playerDice.forEach(d => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<label>' + d.id + '</label><select data-die="' + d.id + '"></select>';
      dice.appendChild(row);
      row.querySelector('select').addEventListener('change', (e) => { setFace(d.id, Number(e.target.value)); e.target.blur(); });
    });
    $('dbgShow').addEventListener('change', (e) => setHidePips(!e.target.checked));
    $('dbgRrMinus').addEventListener('click', () => addRerolls(-1));
    $('dbgRrPlus').addEventListener('click', () => addRerolls(1));
    $('dbgReset').addEventListener('click', resetEnemy);
    $('dbgScars').addEventListener('click', clearScars);
    $('dbgTax').addEventListener('click', () => setTax(U.game && U.game.tax ? 0 : C.effectRules.tax));
    $('dbgFrzH').addEventListener('click', () => freezeDie('HAND'));
    $('dbgFrzE').addEventListener('click', () => freezeDie(C.headDieId));
    const sel = $('dbgIntent');
    sel.addEventListener('change', (e) => { setIntent(Number(e.target.value)); e.target.blur(); });
    Object.keys(C.items).forEach(id => { const o = document.createElement('option'); o.value = id; o.textContent = C.items[id].name; $('dbgItem').appendChild(o); });
    C.trip.enemyPool.concat(Object.keys(C.sites), [C.trip.campfireId, C.trip.mapStage]).filter((id, i, a) => a.indexOf(id) === i).forEach(id => {
      const o = document.createElement('option'); o.value = id;
      o.textContent = (C.enemies[id] ? 'fight: ' : C.sites[id] ? 'site: ' : '') + id; $('dbgJump').appendChild(o);
    });
    $('dbgGive').addEventListener('click', () => giveItem($('dbgItem').value));
    $('dbgJumpGo').addEventListener('click', () => jumpTo($('dbgJump').value));
    $('dbgWinB').addEventListener('click', () => U.forceWin(C.text.beaten) && syncPanel(true));
    $('dbgWinF').addEventListener('click', () => U.forceWin(C.text.befriended) && syncPanel(true));
    $('dbgScar1').addEventListener('click', () => addScars(E.tripScars(U.trip) + 1));
    $('dbgScarM').addEventListener('click', () => addScars(C.maxScars - 1));
    $('dbgLose').addEventListener('click', () => forceLose());
    $('dbgMap').addEventListener('change', (e) => { U.setShowMap(e.target.checked); });
    $('dbgSite').addEventListener('change', (e) => { U.setShowSite(e.target.checked); });
    $('dbgDaySet').addEventListener('click', () => { setDaylight(Number($('dbgDay').value)); });
    $('dbgNoiseSet').addEventListener('click', () => { setNoise(Number($('dbgNoise').value)); });
    $('dbgScarSet').addEventListener('click', () => { setScars(Number($('dbgScarN').value)); });
    $('dbgStartM1').addEventListener('click', () => { U.startTrip('m1'); syncPanel(true); });
    $('dbgStartM2').addEventListener('click', () => { U.startTrip('m2'); syncPanel(true); });
    $('dbgMode').addEventListener('click', () => { U.showStart(); syncPanel(true); });

    // keep the panel's own typing / clicks away from the game's global key handlers (1-3) — except the toggle key
    panel.addEventListener('keydown', (e) => { if (e.key !== '`') e.stopPropagation(); });
    window.addEventListener('keydown', (e) => {
      if (e.key === '`' || e.code === 'Backquote') { e.preventDefault(); toggle(); }
    });
  }

  function toggle(force) {
    open = force === undefined ? !open : !!force;
    panel.classList.toggle('open', open);
    $('btnDebug').classList.toggle('on', open);
    if (open) syncPanel(true);
  }

  // Cheap signature of everything the panel shows; the panel re-renders only when it changes (no per-frame DOM churn).
  function signature() {
    const g = U.game, ui = U.ui;
    const t = U.trip;
    if (!g) return ['nogame', ui.screen, t.stageIdx, t.stage, t.daylight, t.inventory.length, t.log.length].join('#');
    if (g.siteId !== undefined) return ['site', ui.phase, ui.screen, g.siteId, g.turn, g.rerolls, g.noise, g.log.length, t.inventory.length, t.daylight,
      g.player.dice.map(d => d.idx + ':' + d.faces.join(',')).join('|')].join('#');
    return [ui.phase, ui.screen, g.enemyId, g.turn, g.rerolls, g.log.length, ui.hidePips, g.enemy.current && g.enemy.current.faceIdx,
      t.stageIdx, t.inventory.length, t.log.length, g.over,
      g.player.dice.map(d => d.idx + ':' + d.faces.join(',')).join('|')].join('#');
  }
  function syncPanel(force) {
    if (!panel || !open) return;
    const s = signature();
    if (!force && s === sig) return;
    sig = s;
    if (isSite()) {                            // scavenge site: dice controls work, enemy controls don't
      const g = U.game, ui = U.ui;
      const hid = ui.phase !== 'arranging';
      ['dbgIntent', 'dbgReset', 'dbgScars'].forEach(id => { $(id).disabled = true; });
      $('dbgRrMinus').disabled = hid || g.rerolls <= 0; $('dbgRrPlus').disabled = hid;
      $('dbgRr').textContent = g.rerolls + ' left';
      g.player.dice.forEach(d => {
        const sel = panel.querySelector('select[data-die="' + d.id + '"]');
        sel.innerHTML = d.faces.map((f, i) => '<option value="' + i + '">' + (i + 1) + ': ' + f + '</option>').join('');
        sel.value = d.idx; sel.disabled = hid;
      });
      $('dbgNoise').value = g.noise;
      $('dbgDay').value = U.trip.daylight;
      $('dbgNote').textContent = 'scavenge site: ' + g.name + ', noise ' + g.noise + '/' + g.noiseMax + ' (a full track brings the guardian at the end of the turn)';
      const log = g.log.slice(-C.debug.logRows).reverse();
      $('dbgLog').innerHTML = log.map(() => '<li></li>').join('');
      $('dbgLog').querySelectorAll('li').forEach((li, i) => { li.textContent = log[i]; });
      return;
    }
    if (!U.game) {                              // map / intro placement / other screens: no encounter exists
      $('dbgNote').textContent = U.ui.screen + ': no encounter now (jump to one to use the fight controls)';
      ['dbgIntent', 'dbgReset', 'dbgScars', 'dbgRrMinus', 'dbgRrPlus'].forEach(id => { $(id).disabled = true; });
      panel.querySelectorAll('select[data-die]').forEach(x => { x.disabled = true; });
      $('dbgDay').value = U.trip.daylight;
      return;
    }
    const g = U.game, ui = U.ui, dis = busy();
    const hidden = ui.phase !== 'arranging';
    if (intentFor !== g.enemyId) {            // intent options follow the current enemy's faces
      intentFor = g.enemyId;
      $('dbgIntent').innerHTML = C.enemies[g.enemyId].faces.map((cf, i) => '<option value="' + i + '">' + (i + 1) + ': ' + cf.name + '</option>').join('');
    }
    g.player.dice.forEach(d => {
      const sel = panel.querySelector('select[data-die="' + d.id + '"]');
      sel.innerHTML = d.faces.map((f, i) => '<option value="' + i + '">' + (i + 1) + ': ' + f + '</option>').join('');
      sel.value = d.idx; sel.disabled = hidden;
      sel.title = hidden ? (dis ? 'locked during playback' : 'ROLL first: dice are hidden until rolled') : '';
    });
    $('dbgShow').checked = !ui.hidePips;
    $('dbgRr').textContent = g.rerolls + ' left' + (g.rerollPenalty ? ' (−' + g.rerollPenalty + ' next turn)' : '') +
      (g.tax ? ' · taxed −' + g.tax : '') + g.player.dice.filter(d => d.frozen).map(d => ' · ' + d.id + ' frozen').join('');
    $('dbgRrMinus').disabled = ui.phase !== 'arranging' || g.rerolls <= 0;
    $('dbgRrPlus').disabled = ui.phase !== 'arranging';
    $('dbgIntent').value = g.enemy.current.faceIdx;
    $('dbgIntent').disabled = !live();
    $('dbgReset').disabled = !live();
    $('dbgScars').disabled = !live();
    $('dbgNote').textContent = dis ? 'locked while the commit plays back'
      : ui.screen !== 'encounter' ? 'not in an encounter (' + ui.screen + '): jump to one to use the fight controls'
      : (ui.phase === 'won' || ui.phase === 'lost') ? 'fight over: CONTINUE, or jump / restart the trip'
      : ui.phase === 'await-roll' ? 'dice are hidden until ROLL (face + reroll controls wake up after)' : '';
    // log: engine pushes the new line at once, hide it until playback is over
    const log = g.log.slice(0, g.log.length - (dis ? 1 : 0)).slice(-C.debug.logRows).reverse();
    $('dbgLog').innerHTML = log.length ? log.map(l => '<li></li>').join('') : '<li>(no turns yet)</li>';
    if (log.length) $('dbgLog').querySelectorAll('li').forEach((li, i) => { li.textContent = log[i]; });
  }

  function init() {
    U = window.SmugUI;
    build();
    setInterval(() => syncPanel(false), C.debug.pollMs);
    window.SmugDebug = { toggle, setTax, freezeDie, setFace, addRerolls, resetEnemy, setIntent, clearScars, setHidePips, giveItem, jumpTo, addScars, forceLose,
      setDaylight, setNoise, setScars, revealMap: (on) => U.setShowMap(on), showSite: (on) => U.setShowSite(on),
      forceWin: (r) => { const ok = U.forceWin(r); syncPanel(true); return ok; }, sync: () => syncPanel(true) };
  }
  document.addEventListener('DOMContentLoaded', init);
})();
/* DEBUG END */
</script>
